/* chats: one per subject. Full screen gets a column inside the chat window; docked, they live on the edge */
.chat-shell.has-chats .chat-list, .chat-shell.has-chats .chat-compose { margin-left: 264px; }
.chat-shell.has-chats .chat-list { padding-left: max(28px, calc((100% - var(--col, 720px)) / 2)); padding-right: max(28px, calc((100% - var(--col, 720px)) / 2)); }
.chs-col { position: absolute; z-index: 6; left: 0; top: 64px; bottom: 0; width: 264px; display: flex; flex-direction: column; padding: 14px 10px 14px 14px; border-right: 0.5px solid var(--edge, #e8e8e8); overflow: hidden; }
.chs-col ul, .chs-panel ul { list-style: none; margin: 6px 0 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; }
.chs-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 6px 8px; }
.chs-h b { font-size: 12px; font-weight: 500; color: #717171; }
.chs-new { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--navy); transition: background .15s; }

.chs-s { display: flex; align-items: center; gap: 7px; height: 30px; margin: 0 2px; padding: 0 9px; border-radius: 8px; background: rgba(9,53,85,.045); color: #8a8a8a; }
.chs-s input { all: unset; flex: 1; min-width: 0; font-size: 12.5px; color: var(--navy); } .chs-s input::placeholder { color: #9a9a9a; }
.chs-col li, .chs-panel li { display: flex; flex-direction: column; gap: 2px; padding: 9px 8px; border-radius: 8px; cursor: pointer; transition: background .15s; }
.chs-col li.is-on { background: rgba(9,53,85,.05); }
.chs-col li.is-on .ch-index-t, .chs-panel li.is-on .ch-index-t { color: var(--navy); }
.chs-col li.is-on .chs-tt { font-weight: 600; }
.ch-index-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chs-tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chs-ags { display: inline-flex; flex: none; } .chs-ags > * + * { margin-left: -3px; }
.chs-u { margin-left: 6px; font-style: normal; font-size: 11px; font-weight: 500; color: var(--coral); }
.chs-w { color: #8a8a8a; }
.chs-0 { padding: 10px 8px; font-size: 12px; color: #8a8a8a; cursor: default; }
.chs-panel { display: flex; flex-direction: column; max-height: min(560px, 100%); }
.chs-panel .chs-s { margin-bottom: 2px; }

/* chats grouped by who you were talking to; each row is just the subject */
.chs-l { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }
.chs-g ul { margin: 2px 0 0 !important; overflow: visible !important; flex: none !important; }
.chs-gh { display: flex; align-items: center; gap: 7px; padding: 0 8px 4px; font-size: 11.5px; font-weight: 500; color: #8a8a8a; }
.chs-col li, .chs-panel li { flex-direction: row !important; align-items: center; gap: 8px !important; padding: 7px 8px !important; }
.chs-tt { font-size: 13px; color: var(--navy); }
.chs-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.chs-panel .chs-l { max-height: 440px; }

/* a new chat: the field sits in the middle of the window, the ways in underneath it */
.chat-shell.is-newchat .chat-list { flex: 1 1 0; justify-content: flex-end; padding-bottom: 8px; }
.chat-shell.is-newchat .chat-newfill { flex: 1.15 1 0; }
.chat-shell.is-newchat .chat-empty { margin: auto 0 0; padding-bottom: 14px; } .chat-shell.is-newchat .chat-empty h3 { margin: 0; }
.chat-new { flex-direction: column; align-items: stretch; gap: 14px; margin-top: 16px; }
.chat-tag { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.chat-tag > span { margin-right: 4px; font-size: 12px; color: #8a8a8a; }
.chat-tag button, .chat-new-s button { display: inline-flex; align-items: center; gap: 7px; }
.chat-tag button em, .chat-new-s button em { font-style: normal; font-size: 12px; color: #8a8a8a; }
.chat-new-s { display: flex; flex-wrap: wrap; gap: 8px; }

.chat-shell.is-newchat .chat-empty { display: none; }
.chat-new-h { margin: 0 0 16px 2px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; color: var(--navy); }

/* with the chats column, the thread and the field keep their full width in the space that's left */
.chat-shell.has-chats .chat-list { padding-left: max(28px, calc((100cqw - 264px - var(--col, 760px)) / 2)) !important; padding-right: max(28px, calc((100cqw - 264px - var(--col, 760px)) / 2)) !important; }
.chat-shell.has-chats .chat-compose { padding-left: max(16px, calc((100cqw - 264px - var(--col, 760px)) / 2 - 12px)) !important; padding-right: max(16px, calc((100cqw - 264px - var(--col, 760px)) / 2 - 12px)) !important; }

/* a new chat: under the field, what's moving right now as quiet lines (no pills); each line changes as things move */
.chat-moving { display: flex; flex-direction: column; margin-top: 22px; }
.cm-r { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) 72px; align-items: center; column-gap: 8px; min-height: 40px; padding: 0 6px; transition: background .15s; }

.cm-t { display: flex; align-items: center; gap: 9px; min-width: 0; } .cm-t b { font-size: 14px; font-weight: 400; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-l { position: relative; min-width: 0; height: 20px; overflow: hidden; font-size: 14px; line-height: 20px; color: var(--ink, #545454); }
.cm-l > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-r .wl-spark { color: var(--navy); opacity: .55; justify-self: end; }
.cm-r.is-new .cm-t b::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--coral); vertical-align: 2px; }
.cm-dot { width: 6px; height: 6px; margin: 0 4px; border-radius: 50%; background: rgba(9,53,85,.3); flex: none; }
.cm-need { width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: #c4142f; flex: none; }
.cm-k { margin-top: 14px; font-size: 12.5px; color: #8a8a8a; } .cm-k kbd { font-family: inherit; padding: 1px 6px; border-radius: 4px; background: rgba(9,53,85,.06); color: var(--navy); }

/* chat rows hover like the sidebar: a soft pill grows out of where the cursor came in; the open chat sits filled */
.chs-col li, .chs-panel li { position: relative; }
.chs-col li:hover, .chs-panel li:hover { background: none !important; }
.chs-col li > :not(.chs-hover), .chs-panel li > :not(.chs-hover) { position: relative; z-index: 1; }
.chs-hover { position: absolute; border-radius: 8px; background: rgba(9,53,85,.05); }
.chs-tp { padding: 5px 8px 5px 22px !important; }
.chs-tp .chs-tt { font-size: 12.5px; color: #717171; }
.chs-tp.is-tp .chs-tt { color: var(--navy); }
.ag-actsrow { margin-top: 8px; animation: ag-fade .5s cubic-bezier(.16, 1, .3, 1) both; }
.ag-actsrow .ch-acts { margin-left: -8px; }
.ag-msg .ag-sug { margin-top: 20px; }
/* one sentence per line: same size, same weight; the glyph says what kind of thing it is */
.cm-r { border-radius: 8px; padding: 0 10px !important; margin: 0 -10px; }
.cm-l { font-weight: 400; }
/* one dark gray for the words and the glyphs; only what needs you takes colour */
.cm-t b, .cm-l { color: #4a4a4a !important; }
.cm-ic { flex: none; color: #4a4a4a; }
.cm-ic.is-need { color: #c4142f; }
.cm-r .wl-spark { color: #4a4a4a !important; opacity: .45 !important; }
/* a decision, answered in the thread: fills only, no outlines */
.ag-job { width: 100%; }
.ag-dec { display: inline-flex; gap: 4px; }
.ag-dec button { all: unset; cursor: pointer; height: 22px; padding: 0 9px; border-radius: 5px; font-size: 11.5px; font-weight: 500; transition: background .15s, color .15s; }
.ag-dec .ag-dec-y { background: rgba(9,53,85,.07); color: var(--navy); } .ag-dec .ag-dec-y:hover { background: rgba(9,53,85,.12); }
.ag-dec .ag-dec-n { color: #6f6f6f; } .ag-dec .ag-dec-n:hover { background: rgba(9,53,85,.06); color: var(--navy); }
.ag-job.is-decided em { color: var(--navy) !important; }
/* an agent's update: one quiet line under its name, no tools */
.ag-msg:has(.ag-who small) .ag-text { margin-top: 8px; }
/* deliveries: finished work handed back in the thread */
.ag-dls { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; animation: ag-fade .5s cubic-bezier(.16, 1, .3, 1) both; }
.ag-dl { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 8px; background: rgba(9,53,85,.04); }
.ag-dl-h { display: flex; align-items: center; gap: 8px; color: #12805c; }
.ag-dl-h b { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--navy); }
.ag-dl-h button { all: unset; cursor: pointer; height: 22px; padding: 0 9px; border-radius: 5px; font-size: 11.5px; font-weight: 500; color: var(--navy); transition: background .15s; }
.ag-dl-h button:hover { background: rgba(9,53,85,.07); }
.ag-dl p { margin: 0 0 0 20px; font-size: 13px; line-height: 21px; color: #4a4a4a; text-wrap: pretty; }
.ag-dl-n { font-size: 12px !important; color: #8a8a8a !important; } .ag-dl-n i { font-style: normal; margin: 0 6px; }
.ag-dl-s { position: relative; display: inline-flex; }
.ag-dl-h button.is-on { background: rgba(9,53,85,.07); }
.ag-dl-m { right: 0; left: auto !important; top: calc(100% + 4px); min-width: 230px; z-index: 6; }
.ag-dl-g { display: block; padding: 6px 10px 2px; font-size: 11px; color: #8a8a8a; }
/* a delivery's foot: who it's for (and the note it was reworked with), then Open and Share */
.ag-dl-f { display: flex; align-items: center; gap: 12px; margin: 2px 0 -4px 20px; }
.ag-dl-f .ag-dl-n { flex: 1; min-width: 0; margin: 0; font-size: 11.5px !important; line-height: 16px; }
.ag-dl-b { flex: none; display: inline-flex; align-items: center; gap: 2px; margin-right: -9px; }
.ag-dl-b button { all: unset; cursor: pointer; height: 26px; padding: 0 9px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--navy); }
.ag-dl-b button.is-on { background: rgba(9,53,85,.07); }
.ag-dl-v { margin-left: 8px; font-style: normal; font-size: 11px; font-weight: 500; color: #8a8a8a; }
/* agent rows: the sidebar's hover; open in place */
.ag-job { position: relative; }
.ag-job:hover { background: none !important; }
.ag-job > :not(.chs-hover) { position: relative; z-index: 1; }
.ag-job.is-open { background: rgba(9,53,85,.05); }
.ag-dec { position: relative; z-index: 2; }
.ag-pk { overflow: hidden; }
.ag-pk-in { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 12px 32px; }
.ag-pk-p { margin: 0; font-size: 13px; line-height: 19px; color: #4a4a4a; text-wrap: pretty; }
.ag-pk-m { margin: 0; font-size: 12.5px; line-height: 18px; color: #4a4a4a; } .ag-pk-m span { margin-right: 8px; font-size: 11.5px; font-weight: 500; color: #8a8a8a; }
.ag-pk-s { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.ag-pk-s li { position: relative; padding-left: 16px; font-size: 12.5px; line-height: 18px; color: #6f6f6f; } .ag-pk-s li::before { content: "✓"; position: absolute; left: 0; top: 0; font-size: 11px; color: #9a9a9a; }
.ag-pk-f { display: flex; align-items: center; gap: 0; margin-top: 2px; font-size: 11.5px; color: #8a8a8a; } .ag-pk-f i { font-style: normal; margin: 0 6px; }
.ag-pk-f button { all: unset; cursor: pointer; margin-left: auto; height: 22px; padding: 0 9px; border-radius: 5px; font-size: 11.5px; font-weight: 500; color: var(--navy); } .ag-pk-f button:hover { background: rgba(9,53,85,.07); }
.ag-dl .ag-pk-in { padding: 6px 0 4px 20px; }
/* an agent's tools stay out of the way until you're on its answer (or using one) */
/* they come in at once and leave late, so overshooting the row by a few px (or a label pushing a button out from
   under the cursor) never blinks them away; the row also carries a little hover margin under itself */
.ag-msg .ag-actsrow { position: relative; opacity: 0; transition: opacity .25s ease .6s; animation: none !important; }
.ag-msg .ag-actsrow::after { content: ""; position: absolute; left: -12px; right: -12px; top: 100%; height: 14px; }
.ag-msg:hover .ag-actsrow, .ag-msg:focus-within .ag-actsrow, .ag-actsrow:hover, .ag-actsrow:has(.is-on), .ag-actsrow:has(.is-watching) { opacity: 1; transition: opacity .15s ease 0s; }
@media (hover: none) { .ag-msg .ag-actsrow { opacity: 1; } }
/* the page card sits evenly in the window: the bottom gap only opens for the dials' timeline. The ask fields keep their
   height on screen (they ride up by the space the card gained), so nothing ends up hugging the bottom edge */
:root { --app-b: 72px; --lift: 0px; }
.dials-off { --app-b: 13px; --lift: 0px; }
.app { padding-bottom: var(--app-b) !important; }
.chat-shell.is-full .chat-compose { padding-bottom: calc(20px + var(--lift)) !important; }
.chat-shell.is-dock .chat-compose { padding-bottom: calc(12px + var(--lift)) !important; }
/* the chat's menus grow out of their button too */
@keyframes menuTL { from { clip-path: inset(0 calc(100% - 40px) calc(100% - 28px) 0 round 7px); } to { clip-path: inset(-40px -40px -40px -40px); } }
@keyframes menuTR { from { clip-path: inset(0 0 calc(100% - 28px) calc(100% - 40px) round 7px); } to { clip-path: inset(-40px -40px -40px -40px); } }
@keyframes menuIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
.ch-menu { animation: menuTL .36s cubic-bezier(.32,.72,0,1) both; }
.ag-dl-m { animation: menuTR .36s cubic-bezier(.32,.72,0,1) both; }
.ch-menu > *, .ag-dl-m > * { animation: menuIn .28s .08s cubic-bezier(.22,1,.36,1) both; }
@media (prefers-reduced-motion: reduce) { .ch-menu, .ag-dl-m, .ch-menu > *, .ag-dl-m > * { animation: none !important; } }
/* the orb is a lit sphere: a soft contact shadow under it keeps its pale top from melting into a white page */
.aorb-gl canvas { filter: drop-shadow(0 1px 1.5px rgba(40,30,90,.16)) drop-shadow(0 0 .5px rgba(40,30,90,.08)); }
/* the orbs never pulse or grow: only the colour moves across them */
.aorb-gl, .aorb-gl.is-live { animation: none !important; transform: none !important; }
.ag-ripple { display: none !important; }

/* the shared hover (hover.js): a pill that grows sideways out of the pointer, like the sidebar's */
.hv-host { position: relative; }
:where(:has(> .hv-fill)) { position: relative; } :where(:has(> .hv-fill)) > :not(.hv-fill) { position: relative; z-index: 1; } /* React can rewrite a row's class mid-hover and drop hv-host: the fill still has a box to sit in */
.hv-host > :not(.hv-fill) { position: relative; z-index: 1; }
.hv-fill { position: absolute; z-index: 0; border-radius: 6px; background: rgba(9,53,85,.05); pointer-events: none; }
.hv-host > .hv-fill { position: absolute; }
.fd-row.is-rc .fd-row-s { display: flex; align-items: center; gap: 6px; color: var(--navy); }
.fd-rc-i { flex: none; color: #098486; } .fd-rc-w { color: var(--mute); }
/* Files' filters pick, they don't act: the choice is paper on a gray track (as in the routine card), so the page keeps navy for actions */
.fl-ctl .seg, .fl-ctl .fl-views { border: 0; background: var(--sec); }
.fl-ctl .seg-pill { background: var(--paper); }
.fl-ctl .seg button.on, .fl-ctl .fl-views button.is-on { color: var(--navy); }
/* ---- Home, two levels. What needs you is one card built like the chart cards: the tray is the frame (1.09px rim), the rows
   sit on paper inside, a footer line on the tray. In progress sits under it on the page: quieter, no card, no buttons */
.fd-nc { margin-top: 4px; padding: 1.09px 1.09px 0; border-radius: 10px; background: var(--well); }
.fd-rows.fd-nc-p { gap: 0; padding: 4px 14px; border-top: 0; border-radius: 8.75px; background: var(--paper); }
.fd-nc-p > .fd-row { border-bottom: 0.5px solid var(--line); }
.fd-nc-p > .fd-row:last-child { border-bottom: 0; }
.fd-nc-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 33.5px; padding: 0 15.3px; font-size: 13px; line-height: 18px; color: var(--ink); }
.fd-nc-f span:last-child { color: var(--mute); }
.fd-grow .mt-clip { box-shadow: inset 0 0 0 1.09px var(--well); } /* an item opened from the card keeps the card's rim */
.fd-mv { margin-top: 36px; padding: 0 15.1px; } /* the card's rim + inner padding, so faces and titles line up with the rows above */
.fd-mv-h { margin-left: -15.1px !important; display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.fd-mv-h em, .fd-mv-d { font-style: normal; font-size: 13px; font-weight: 400; color: var(--mute); }
.fd-mv-d { margin: 18px 0 4px -15.1px; }
.fd-mv-r { position: relative; display: grid; grid-template-columns: var(--face-col, 52px) minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 44px; padding: 6px 8px; border-radius: 8px; cursor: pointer; outline: none; }
.fd-mv-f { display: inline-flex; align-items: center; }
.fd-mv-t { display: flex; align-items: baseline; gap: 10px; min-width: 0; font-size: 13px; line-height: 18px; }
.fd-mv-t b { flex: none; font-weight: 500; color: var(--navy); }
.fd-mv-s { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--mute); }
.fd-mv-w { font-size: 13px; color: var(--mute); }
/* the work moving, in North's tick mark (as on the charts and the Agents floor): 20 fine ticks, lit to how far it's got */
.fd-mk { display: inline-flex; align-self: center; align-items: center; gap: 2.5px; height: 12px; }
.fd-mk i { width: 1.5px; height: 10px; border-radius: 1px; background: rgba(9,53,85,.14); transition: background .6s; }
.fd-mk i.is-on { background: #098486; }
.fd-mk.is-ind i { animation: fdTick 1.8s linear infinite; }
@keyframes fdTick { 0%, 100% { background: rgba(9,53,85,.14); } 6% { background: #098486; } 18% { background: rgba(9,53,85,.14); } }
.fd-mv-r.is-done .fd-mv-s { color: var(--ink); }
.rt-mk { display: inline-flex; align-self: center; flex: none; margin-left: -4px; } .rt-mk .rt-g { width: 12px; height: 12px; } /* a routine's work: its mark before the title */
.rl3-rts .rt-g { width: 12px; height: 12px; flex: none; } /* the routine mark in the face's spot, so the line under it aligns */ /* never a grid or flex item, whatever the host's own child rules say (Home's rows: ".fd-row > span") */
.is-dark .hv-fill, .stg2.is-dark .hv-fill { background: rgba(255,255,255,.07); }
/* those rows drop their old instant hover fill, so only the grow shows */
.pg .dd-m button.hv-host:hover:not(.is-on), .pg .rc-addm button.hv-host:hover, .ag-dl-m button.hv-host:hover, .ch-menu button.hv-host:hover, .cd-menu button.hv-host:hover,
.rl3-rd.hv-host:hover, .pg .rl3-ag.hv-host:hover:not(.is-hov), .lv2-r.hv-host:hover:not(.is-sel), .cm-r.hv-host:hover { background: transparent !important; }
.pg .rl3-ag.is-hov.hv-host { background: transparent !important; }
/* dropdown motion from the dials (Menus → "Dropdown grows out of its button") */
.dd-m.is-unit { animation-duration: var(--menu-d, .62s) !important; animation-timing-function: var(--menu-e, cubic-bezier(.16,1,.3,1)) !important; }
.ch-menu, .ag-dl-m { animation-duration: var(--menu-d, .62s) !important; animation-timing-function: var(--menu-e, cubic-bezier(.16,1,.3,1)) !important; }
/* Agents has no charts: no target to point with, and no tip about it */
html:has(.agx) .ask-aim, html:has(.agx) .chat-aim, html:has(.agx) .chat-tip { display: none !important; }
/* K: the bar rises from the bottom, page stays sharp; its questions sit above the field */
.chat-shell.is-bar { top: auto !important; bottom: calc(var(--bar-b, 20px) + env(safe-area-inset-bottom, 0px)) !important; }
.chat-shell.is-bar .chat-compose { display: flex; flex-direction: column; }
.chat-shell.is-bar .chat-sugs { order: -1; margin: 0 0 10px !important; padding: 0 2px; }
.chat-shell.is-bar .chat-tip, .chat-shell.is-bar .chat-sugs { display: none !important; }
/* the bar is one solid card (questions + field), the same card that grows into the answer */
.chat-shell.is-bar { background: rgba(255,255,255,.985) !important; -webkit-backdrop-filter: blur(24px) saturate(1.2) !important; backdrop-filter: blur(24px) saturate(1.2) !important; padding: 10px; min-height: 0 !important;
  box-shadow: 0 0 0 .5px rgba(9,53,85,.06), 0 1px 2px rgba(9,53,85,.04), 0 8px 16px -6px rgba(9,53,85,.07), 0 24px 48px -16px rgba(9,53,85,.14) !important; }
.chat-shell.is-bar .chat-input { box-shadow: none !important; }
/* the answer floats over the page: solid enough to read, a real lift off what's under it */
.chat-shell.is-float { background: rgba(255,255,255,.985) !important; -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 0 0 .5px rgba(9,53,85,.06), 0 1px 2px rgba(9,53,85,.04), 0 8px 16px -6px rgba(9,53,85,.07), 0 24px 48px -16px rgba(9,53,85,.14) !important; }
html.chat-open .agx .ask-dock.is-north { opacity: 0; pointer-events: none; translate: -50% 8px; }
/* one radius system for the bar and the panel it becomes: field 4px, 10px around it, so the card is 14px */
.chat-shell.is-bar, .chat-shell.is-float { border-radius: 14px !important; }
.chat-shell.is-bar .chat-input, .chat-shell.is-float .chat-input { border-radius: 4px !important; }
.chat-shell.is-float .chat-compose { padding: 0 10px 10px !important; }
.chat-shell.is-bar .chat-sugs { margin: 2px 0 10px !important; }
.chat-shell.is-float .chat-list { padding-bottom: 16px !important; }
.chat-shell.is-bar .chat-input { margin: 0 !important; }
/* the K bar is one surface: the card is the field, so there's no box inside a box */
.chat-shell.is-bar { padding: 0 !important; }
.chat-shell.is-bar .chat-compose { padding: 0 !important; }
.chat-shell.is-bar .chat-input, .chat-shell.is-bar .chat-compose:has(.chat-ctx) .chat-input { border: 0 !important; background: transparent !important; border-radius: 14px !important; min-height: 58px; }
/* the answer panel keeps the bar's anatomy: the field is the bottom of the card, set off by a hairline, not a box inside it */
.chat-shell.is-float .chat-compose { padding: 0 !important; border-top: 0.5px solid var(--line); }
.chat-shell.is-float .chat-input, .chat-shell.is-float .chat-compose:has(.chat-ctx) .chat-input { border: 0 !important; background: transparent !important; border-radius: 0 0 14px 14px !important; min-height: 58px; }
.chat-shell.is-bar, .chat-shell.is-float { border-color: transparent !important; } /* one edge: the shadow's hairline, not a border plus a ring */
/* what you're asking about rides in as a banner across the top of the bar (or above the field once it's an answer) — part of the card, no outline of its own */
.chat-shell.is-bar .chat-ctx, .chat-shell.is-float .chat-ctx { width: auto; margin: 0 !important; padding: 9px 10px 9px 16px; border: 0 !important; border-radius: 0 !important; background: #f3f4f5 !important; }
.chat-shell.is-bar .chat-ctx:not(.chat-ctx + .chat-ctx) { border-radius: 14px 14px 0 0 !important; }
.chat-shell.is-bar .chat-ctx + .chat-ctx, .chat-shell.is-float .chat-ctx + .chat-ctx { border-top: 0.5px solid #e6e7e8 !important; }
.chat-shell.is-bar .chat-compose:has(.chat-ctx) .chat-input { border-radius: 0 0 14px 14px !important; }
/* Agents already has its field: K lifts that one instead of bringing a second */
html body .agx .ask-dock.is-north .composer.is-focus { border-color: transparent !important; background: #fff !important;
  box-shadow: 0 0 0 .5px rgba(9,53,85,.06), 0 1px 2px rgba(9,53,85,.04), 0 8px 16px -6px rgba(9,53,85,.07), 0 24px 48px -16px rgba(9,53,85,.14) !important; }
.agx .ask-dock.is-north .composer { transition: box-shadow .35s cubic-bezier(.16,1,.3,1), border-color .35s, background-color .35s; }
/* new chat: the agents at work, above the question */
.nl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 44px; }
.nl-a { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 14px 12px; border-radius: 10px; background: rgba(9,53,85,.025); transition: background .2s; }

.nl-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; } .nl-h b { font-size: 13px; font-weight: 600; color: var(--navy); } .nl-h em { margin-left: auto; font-style: normal; font-size: 12px; color: #8a8a8a; }
.nl-t { font-size: 13.5px; line-height: 18px; font-weight: 500; color: var(--navy); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.nl-th { display: block; min-height: 34px; font-size: 12.5px; line-height: 17px; color: #6b6b6b; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nl-p { position: relative; height: 2px; margin-top: 8px; border-radius: 2px; background: rgba(9,53,85,.08); overflow: hidden; }
.nl-p i { position: absolute; inset: 0; transform-origin: 0 50%; background: var(--c, var(--navy)); border-radius: 2px; opacity: .75; }
.nl-s { font-size: 11.5px; color: #8a8a8a; }
/* the callouts under the field read at medium weight */
.chat-shell .cm-t b, .chat-shell .cm-l { font-weight: 500 !important; }
.nl-caret { display: inline-block; width: 1.5px; height: 12px; margin-left: 1px; vertical-align: -1px; background: currentColor; opacity: .6; }
/* new chat texture: fills the room right of your chats, behind everything, fading out toward the bottom */
.nw-tex { position: absolute; left: 264px; right: 0; top: 53px; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 52%, transparent 92%); mask-image: linear-gradient(to bottom, #000 0, #000 52%, transparent 92%); }
.chat-shell.is-newchat .chat-compose, .chat-shell.is-newchat .chat-list { position: relative; z-index: 1; }
/* the light under the new chat's texture: three pools in the agents' colours, very faint, fading out above the field */
.nw-glow { position: absolute; inset: 0; z-index: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 30%, transparent 62%); mask-image: linear-gradient(to bottom, #000 0, #000 30%, transparent 62%); }
.nw-glow i { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; }
.nw-glow i::before { content: ""; position: absolute; left: -26vw; top: -26vw; width: 52vw; height: 52vw; border-radius: 50%; }
.nw-glow .is-orin::before { background: radial-gradient(closest-side, rgba(61,91,217,.11), rgba(61,91,217,0)); }
.nw-glow .is-riley::before { background: radial-gradient(closest-side, rgba(31,158,90,.10), rgba(31,158,90,0)); }
.nw-glow .is-calvin::before { background: radial-gradient(closest-side, rgba(180,35,60,.09), rgba(180,35,60,0)); }
.nw-tex .hw { z-index: 1; }
/* a chat's topics sit inside it: indented, on a hairline guide, so they never read as chats of their own */
.chs-col li.chs-tp, .chs-panel li.chs-tp { position: relative; margin-left: 14px; padding: 5px 8px 5px 12px !important; }
.chs-col li.chs-tp::before, .chs-panel li.chs-tp::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: var(--edge, #e2e2e2); }
.chs-col li.chs-tp.is-tp::before, .chs-panel li.chs-tp.is-tp::before { background: var(--navy); opacity: .5; }
/* full screen: the topic squares sit at the thread's own edge, right of the chats column */
.chat-shell.is-full.has-chats .ch-index { left: 264px; }
/* ================= one type scale (chat) — body 15 · interface 13 · meta 11.5 · weights 400/500 · navy + grey ================= */
.chat-shell .ag-who b { font-size: 13px !important; font-weight: 500 !important; }
.chat-shell .ag-who small { font-size: 11.5px !important; font-weight: 400 !important; color: #8a8a8a !important; }
.chat-shell .ag-job > span, .chat-shell .ag-dec button { font-size: 13px !important; }
.chat-shell .ag-dec-y { font-weight: 500 !important; } .chat-shell .ag-dec-n { font-weight: 400 !important; color: #8a8a8a !important; }
.chat-shell .ag-job > em { font-size: 11.5px !important; font-weight: 400 !important; color: #8a8a8a !important; font-style: normal; }
.chat-shell .ch-topic b, .chat-shell .ch-topic > span:first-child { font-weight: 500 !important; }
.chat-shell .ch-user { font-size: 15px !important; }
.chat-shell .ch-user, .chat-shell .ch-user * { font-size: 15px !important; }
.chat-shell .ag-sug-t { font-size: 13px !important; font-weight: 400 !important; color: #8a8a8a !important; }
.chat-shell .ag-sug button, .chat-shell .ag-sug b { font-size: 13px !important; font-weight: 500 !important; }
.chat-shell .ag-job > span:not(.ag-dec) { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 18px; }
.chat-shell .ag-dec button { padding-left: 10px !important; padding-right: 10px !important; }
.chat-shell .ag-job { height: auto !important; min-height: 40px; padding-top: 6px !important; padding-bottom: 6px !important; align-items: center; }

/* ================= motion pass: nothing switches on/off, everything folds on one curve ================= */
:root { interpolate-size: allow-keywords; --sx: cubic-bezier(.32,.72,0,1); }
/* sidebar sections fold to the rail instead of display:none (which popped) */
.is-rail .nav-sec + .nav-sec .sec-head { display: flex !important; height: 0; padding-top: 0; opacity: 0; overflow: hidden; pointer-events: none; }
.is-rail .nav-sec + .nav-sec .nav-list { display: block !important; height: 0 !important; padding-bottom: 0; opacity: 0 !important; pointer-events: none; }
.rail-cat { display: grid !important; height: 0; margin-top: 0; opacity: 0; overflow: hidden; pointer-events: none; }
.is-rail .rail-cat { height: 36px; margin-top: 2px; opacity: 1; pointer-events: auto; }
.is-rail .nav-sec + .nav-sec::before, .is-rail .acct::before { display: block !important; opacity: 0; }
.nav-sec + .nav-sec::before, .acct::before { transition: opacity .2s ease; }
/* the header: the collapse button is pinned to the sidebar's right edge, so it travels with the width on the same curve;
   the logo, name and search stay where they are and fade */
.side-head { position: relative; padding: 0 44px 0 10px !important; gap: 8px !important; }
.is-rail .side-head { position: relative; padding: 0 44px 0 0 !important; gap: 8px !important; }
.side-head .ibtn:last-child, .is-rail .side-head .ibtn:last-child { position: absolute !important; top: 8px; left: auto !important; right: 4px; }
.is-rail .side-head .ibtn:last-child { right: 8px; }
.side-anim .side .side-head .ibtn:last-child { transition: right .4s var(--sx), background .2s !important; }
.side-anim .side :is(.side-head, .side-head > *, .nav-sec, .sec-head, .nav-list, .rail-cat, .nav-row) { transition: height .4s var(--sx), max-width .4s var(--sx), padding .4s var(--sx), margin .4s var(--sx), gap .4s var(--sx), width .4s var(--sx), opacity .16s ease !important; }
/* folding: words go first, icons arrive after; opening: room first, words after */
.side-anim.is-rail .side .rail-cat { transition-delay: 0s, 0s, 0s, 0s, 0s, 0s, .18s !important; }
.side-anim:not(.is-rail) .side :is(.sec-head, .nav-list) { transition-delay: 0s, 0s, 0s, 0s, 0s, 0s, .16s !important; }
.side-anim:not(.is-rail) .side :is(.nav-label, .ws, .nav-row kbd, .nav-score, .acct > div, .sec-head span, .side-head > :not(.ibtn:last-child)) { transition-property: opacity, max-width, padding, margin, height, width, gap !important; transition-duration: .22s, .4s, .4s, .4s, .4s, .4s, .4s !important; transition-delay: .14s, 0s, 0s, 0s, 0s, 0s, 0s !important; }
/* K's bar and the float are 98% opaque white: blurring what's behind them cost a frame for nothing */
.chat-shell.is-bar, .chat-shell.is-float { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
/* chat decisions: "Not now" ends on the same right edge as "Step 3 of 4" */
.chat-shell .ag-dec { margin-right: -10px; }

/* ================= K's speech bubble: your message before you send it =================
   the chat's own user bubble (navy 500 on a navy tint, 4px tail corner), its tail corner on the cursor. No buttons: Enter sends, hold Space to talk */
.chat-shell.is-bar.is-bub { background: #f3f5f7 !important; border-radius: 14px 14px 14px 4px !important;
  box-shadow: 0 0 0 .5px rgba(9,53,85,.07), 0 1px 2px rgba(9,53,85,.05), 0 10px 24px -10px rgba(9,53,85,.18) !important; }
.chat-shell.is-bub.is-r { border-radius: 14px 14px 4px 14px !important; }
.chat-shell.is-bub.is-flip { top: var(--bub-t) !important; bottom: auto !important; border-radius: 4px 14px 14px 14px !important; }
.chat-shell.is-bub.is-flip.is-r { border-radius: 14px 4px 14px 14px !important; }
.chat-shell.is-bub :is(.chat-tool, .chat-send) { display: none !important; }
.chat-shell.is-bub .chat-input, .chat-shell.is-bub .chat-compose:has(.chat-ctx) .chat-input { min-height: 40px !important; padding: 9px 14px !important; border-radius: inherit !important; align-items: center; }
.chat-shell.is-bub textarea { min-width: 0; font-size: 15px !important; line-height: 20px !important; font-weight: 500 !important; color: var(--navy) !important; padding: 0 !important; }
.chat-shell.is-bub textarea::placeholder { color: rgba(9,53,85,.42); font-weight: 500; }
/* what you're pointing at: a quiet first line inside the bubble, set off by a hairline */
.chat-shell.is-bub .chat-ctx { background: transparent !important; padding: 9px 10px 0 14px !important; border-radius: 0 !important; color: rgba(9,53,85,.55); }
.chat-shell.is-bub .chat-ctx span { font-size: 12px !important; }
.chat-shell.is-bub .chat-compose:has(.chat-ctx) .chat-input { padding-top: 6px !important; }
.chat-shell.is-bub textarea { min-height: 20px !important; } .chat-shell.is-bub .chat-input { align-items: flex-start !important; }
/* dark blue: the bubble is navy with white type */
.chat-shell.is-bar.is-bub { background: var(--navy) !important; box-shadow: 0 1px 2px rgba(9,53,85,.12), 0 12px 28px -10px rgba(9,53,85,.45) !important; }
.chat-shell.is-bub textarea { color: #fff !important; caret-color: #fff; }
.chat-shell.is-bub textarea::placeholder { color: rgba(255,255,255,.5) !important; }
.chat-shell.is-bub .chat-ctx, .chat-shell.is-bub .chat-ctx span { color: rgba(255,255,255,.62) !important; }
.chat-shell.is-bub .chat-ctx svg, .chat-shell.is-bub .chat-ctx .ibtn { color: rgba(255,255,255,.62) !important; stroke: currentColor; }
.chat-shell.is-bub .chat-ctx .ibtn:hover { background: rgba(255,255,255,.1) !important; color: #fff !important; }
.chat-shell.is-bub .chat-compose:has(.chat-ctx) .chat-input { min-height: 0 !important; }

/* topics: one line each (the subject, then how many questions, quietly), on North's white; the one you're in is a grey fill, nothing else */
.ch-index-panel { background: #fff !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; border: 0 !important; border-radius: 10px !important; padding: 6px !important; width: 260px !important;
  box-shadow: 0 0 0 .5px rgba(9,53,85,.08), 0 1px 2px rgba(9,53,85,.05), 0 12px 28px -10px rgba(9,53,85,.2) !important; }
.ch-index-panel > b { padding: 6px 10px 6px !important; font-size: 11.5px !important; font-weight: 500 !important; color: #8a8a8a !important; }
.ch-index-panel li { flex-direction: row !important; align-items: baseline; justify-content: space-between; gap: 12px !important; padding: 8px 10px !important; border-radius: 6px !important; }
.ch-index-panel li .ch-index-t { flex: 1; min-width: 0; color: var(--navy) !important; font-size: 13px !important; font-weight: 400 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-index-panel li .ch-index-s { flex: none; font-size: 11.5px !important; color: #8a8a8a !important; }

.ch-index-panel li.is-on { background: rgba(9,53,85,.06) !important; }
.ch-index-panel li.is-on .ch-index-t { color: var(--navy) !important; font-weight: 500 !important; }
/* the topic you are in is just navy; coral stays for a topic whose numbers changed (is-update) */
.ch-topic.is-cur b { color: var(--navy) !important; }

/* topics: the divider pushing out. One shape: white, a 1px line on its top, right and bottom in the divider's colour, open on the
   left, its width growing from the line. It sits above the chats column so it covers the divider's own stretch. */
.chat-shell { --tp-line: #d3d3d3; } .chat-shell.is-dock, .chat-shell.is-float { --tp-line: #e8e8e8; }
.chat-shell .ch-index.is-open, .chat-shell .ch-index.is-up { z-index: 8; } /* raised from opening until it has fully retracted */
.ch-index-panel { left: -1px !important; background: transparent !important; box-shadow: none !important; border: 0 !important; border-radius: 0 !important;
  padding: 6px 6px 6px 9px !important; width: 240px !important; overflow: visible !important; }
.ch-index-panel > .tp-shape { position: absolute; left: 0; top: 0; bottom: 0; z-index: 0; box-sizing: border-box; background: #fff; border: 1px solid var(--tp-line); border-left: 0; border-radius: 0 6px 6px 0; pointer-events: none; }
.ch-index-panel > b, .ch-index-panel > ul, .ch-index-panel > small { position: relative; z-index: 2; }
.ch-index-panel li { padding: 7px 10px !important; }
.ch-index-panel li .ch-index-t { color: #6b6b6b !important; font-weight: 400 !important; transition: color .15s; white-space: nowrap; }
.ch-index-panel li:hover .ch-index-t { color: var(--navy) !important; }
.ch-index-panel li.is-on .ch-index-t { color: var(--navy) !important; font-weight: 500 !important; }
.ch-index-panel li, .ch-index-panel li.is-on { background: transparent !important; border-radius: 5px !important; transition: background .15s; }
.ch-index-panel li.is-on:hover { background: rgba(9,53,85,.04) !important; }
/* docked, the divider is the chat's own left edge: drawn inside the chat (not as its border) so the panel can open it */
.chat-shell.is-dock { border-left-color: transparent !important; }
.chat-shell.is-dock::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: #e8e8e8; z-index: 5; pointer-events: none; }

/* the squares and the panel are one thing. Opening: each square scales up, moves right and spreads toward its own row while its
   title rises out of it. Closing: titles gather back, and the squares return while the panel retracts, meeting it at the line. */
.ch-index-lines i { transform-origin: 50% 50%; transition: transform .38s cubic-bezier(.32,.72,0,1), opacity .26s ease, width .2s, background .2s !important; transition-delay: calc(.14s + var(--i, 0) * 12ms) !important; }
.ch-index.is-open .ch-index-lines i { transform: translate(16px, calc(var(--o, 0) * 26px)) scale(2.4); opacity: 0; transition-delay: calc(var(--i, 0) * 15ms) !important; }
/* the rows sit centred on the squares (the header doesn't push them down) */
.ch-index-panel { margin-top: -14px; }
/* the panel's corners: softer on the right, and where the divider turns into its top and bottom lines it curves (8px fillets),
   so the line flows out of the divider; the fillets grow with the panel */
.ch-index-panel > .tp-shape { border-radius: 0 10px 10px 0 !important; }
/* where the divider turns into the panel's top and bottom lines it curves (14px fillets). The curve continues the divider exactly:
   same thickness and the same centre line (--tp-w, --tp-x: the divider's width and its centre measured from the panel's left).
   Full screen it's the chats column's 0.5px edge (1px on standard screens); docked, the chat's 1px left line. */
.chat-shell { --tp-w: 1px; --tp-x: .5px; }
@media (min-resolution: 2dppx) { .chat-shell { --tp-w: .5px; --tp-x: .75px; } }
.chat-shell.is-dock, .chat-shell.is-float { --tp-w: 1px; --tp-x: 1.5px; }
.ch-index-panel > .tp-shape { border-width: var(--tp-w) !important; border-left-width: 0 !important; }
.ch-index-panel > .tp-shape > .tp-fil { position: absolute; left: 0; overflow: hidden; pointer-events: none; }
.ch-index-panel > .tp-shape > .tp-fil svg { display: block; overflow: visible; }
/* positioned from the shape's padding box, which sits inside its top and bottom lines: step out by the line's width */
.ch-index-panel > .tp-shape > .tp-fil.is-t { top: calc(-14px - var(--tp-w)); }
.ch-index-panel > .tp-shape > .tp-fil.is-b { bottom: calc(-14px - var(--tp-w)); }

/* Watching, in the chat's header: the header's line pushing down. No card of its own: a white shape with the line on its sides and
   bottom (same colour and width as the header's), open on top, curving into its sides at 14px joints, height growing from the line */
.wl.is-push { background: transparent !important; border: 0 !important; box-shadow: none !important; border-radius: 0 !important; padding: 0 !important; transform: none !important; overflow: visible !important; }
.wl.is-push > .wp-shape { position: absolute; left: 0; right: 0; top: 0; z-index: 0; box-sizing: border-box; background: #fff; border: var(--wp-w) solid var(--wp-line); border-top: 0; border-radius: 0 0 10px 10px; pointer-events: none; }
.wl.is-push > .wp-shape > .wp-fil { position: absolute; top: 0; left: -14px; overflow: visible; }
.wl.is-push > .wp-shape > .wp-fil.is-r { left: auto; right: -14px; transform: scaleX(-1); }
.wl.is-push > .wp-in { position: relative; z-index: 1; padding: 6px; }

/* Watching from the sidebar: the page card's left edge pushing out to the right. Open on the left (the white covers the edge's own
   stretch), the edge's line on its top, right and bottom, 14px curves where the edge turns into them, width growing from the edge */
.wl.is-push.is-side { width: 320px !important; }
.wl.is-push.is-side > .wp-shape.is-side { left: 0; right: auto; top: 0; bottom: 0; border: var(--wp-w) solid var(--wp-line); border-left: 0; border-radius: 0 10px 10px 0; background: var(--wp-fill, #fff); }
.wl.is-push.is-side > .wp-shape > .wp-sfil { position: absolute; left: 0; overflow: hidden; pointer-events: none; }
.wl.is-push.is-side > .wp-shape > .wp-sfil svg { display: block; overflow: visible; }
.wl.is-push.is-side > .wp-shape > .wp-sfil.is-t { top: calc(-14px - var(--wp-w)); }
.wl.is-push.is-side > .wp-shape > .wp-sfil.is-b { bottom: calc(-14px - var(--wp-w)); }
.wl.is-push.is-side > .wp-in { padding: 6px 6px 6px 8px; }
/* no line between the "Watching" heading and the first row */
.wl li:first-child { border-top: 0 !important; }

/* Watching: the header's joints are revealed as the panel grows (clipped to its height) */
.wl.is-push > .wp-shape > .wp-fil { position: absolute; top: 0; left: -14px; overflow: hidden; }
.wl.is-push > .wp-shape > .wp-fil.is-r { left: auto; right: -14px; transform: scaleX(-1); }
.wl.is-push > .wp-shape > .wp-fil svg { display: block; overflow: visible; }
/* the count travels: from the bell (or the sidebar row) into the heading, and back */
.wl.is-push > .wl-n { position: absolute; z-index: 3; top: 15px; right: 18px; font-size: 12px; line-height: 16px; color: #6b6b6b; font-style: normal; }
.wl.is-push.is-side > .wl-n { top: 15px; right: 18px; }
.nav-watch-n { display: inline-block; font-style: normal; }
.nav-watch-n.is-out { visibility: hidden; }
/* the type moves the way the panel does: heading first, then each row, arriving from the side it grows from, just behind its edge */
@keyframes wpInY { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes wpInX { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
.wl.is-push > .wp-in li, .wl.is-push > .wp-in > .wl-empty { animation: wpInY .42s cubic-bezier(.32,.72,0,1) both; animation-delay: calc(.12s + (var(--i, 1) - 1) * 30ms); }
.wl.is-push > .wp-in > .wl-h { animation: wpInH .3s cubic-bezier(.22,1,.36,1) both; animation-delay: .2s; }
@keyframes wpInH { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wl.is-push.is-side > .wp-in li, .wl.is-push.is-side > .wp-in > .wl-empty { animation-name: wpInX; }

/* PushShape joints: tiny SVGs anchored at the line's outer edge, drawing (and filling) outside themselves */
.ps { --ps-line: var(--tp-line, #d3d3d3); }

.ps.is-x > .ps-j.is-tl { left: 0; top: calc(-1 * var(--ps-w)); }
.ps.is-x > .ps-j.is-bl { left: 0; bottom: calc(-1 * var(--ps-w) - 1px); }
.ps.is-y > .ps-j.is-tl { left: calc(-1 * var(--ps-w)); top: 0; }

.wl.is-push > .ps.wp-shape.is-y { border-radius: 0 0 var(--ps-r, 10px) var(--ps-r, 10px) !important; }

/* Watching spreads along its line from what you touched: the rows clip to the same span */

/* flyouts that push out of the line at the rail's edge (EdgeFly): no box of their own, the shape is the surface */

.efly > .ps.ef-shape { position: absolute; left: 0; top: 0; z-index: 0; box-sizing: border-box; background: var(--ef-fill); border: var(--ef-w) solid var(--ef-line); border-left: 0; border-radius: 0 var(--ps-r, 10px) var(--ps-r, 10px) 0 !important; pointer-events: none; }
.efly .ps { --ps-line: var(--ef-line); }
.efly > .ef-in { position: relative; z-index: 1; padding: 8px 8px 8px 10px; clip-path: inset(var(--ps-cn, 0px) var(--ps-cm, 0px) var(--ps-cf, 0px) 0px); }
.efly > .ef-in > b { animation: wpInH .3s cubic-bezier(.22,1,.36,1) both; animation-delay: .16s; }
.efly > .ef-in li { animation: wpInX .42s cubic-bezier(.32,.72,0,1) both; animation-delay: calc(.12s + (var(--i, 1) - 1) * 30ms); }

/* the K bubble opening into the dock (or full screen): its navy gives way to the surface in the first beat of the morph, not over
   a third of a second, which left a blue-grey slab over the page while it travelled */
.chat-shell.is-full { transition: background-color .12s ease-out, border-color .12s ease-out, box-shadow .35s; }
.chat-shell.is-dock { transition: box-shadow .35s; } /* the bubble becomes the dock's surface the moment it starts to open */

/* the chart you asked about, carried into the conversation above your question (a copy of the card as it was on the page) */
.ch-carry-row { display: flex; justify-content: flex-end; margin-bottom: -12px; }

.carry-fly { position: fixed; z-index: 90; pointer-events: none; overflow: hidden; transform-origin: 0 0; will-change: transform; }

.ch-carry.is-live { overflow: visible; pointer-events: auto; }

/* the carried chart: the metric's own six months, quiet label above, no tile around it */
.ch-carry.is-live { width: 600px; max-width: 100%; }
.ch-cchart { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 10px; border-radius: 10px; background: #fff; border: 0.5px solid #e3e3e3; }
.ch-cchart-h { display: flex; align-items: baseline; justify-content: space-between; }
.ch-cchart-h b { font-size: 13px; font-weight: 500; color: var(--navy); }
.ch-cchart-h span { font-size: 12px; color: #6b6b6b; }
.ch-carry-plot { position: relative; }
.ch-carry.is-live.is-flying { visibility: visible; } .ch-carry.is-live.is-flying .ch-carry-plot { visibility: hidden; }

/* a huddle: one contained row (the agents circling each other · who · how long · caret); opens into the room where they talk */
.hd { display: flex; flex-direction: column; gap: 6px; }

.hd.is-live .hd-orb { animation: hdTalk 1.5s cubic-bezier(.45,0,.55,1) infinite; animation-delay: calc(var(--i) * .5s); }
@keyframes hdTalk { 0%, 60%, 100% { transform: translate(0, 0) scale(1); } 20% { transform: translate(0, -3.5px) scale(1.12); } 40% { transform: translate(0, 0) scale(.96); } }

.hd-typing i:nth-child(2) { animation-delay: .15s; } .hd-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes hdDot { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .hd.is-live .hd-orb, .hd-typing i { animation: none; } }
.ag-card { margin: 14px 0 4px; } /* no fade of its own: the chart draws itself on, like an answer's */
.cc-tray-done { font-style: normal; font-size: 14px; color: #6b6b6b; white-space: nowrap; }
.ag-card:empty { display: none; }

/* a chart arriving in the thread: its parts rise in one after another, the plot drawing as it comes (CardIn) */
@keyframes ccRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.cc-enter .cc-head { animation: ccRise .5s cubic-bezier(.22,1,.36,1) both; animation-delay: .04s; }
.cc-enter :is(.cc-big, .cc-lines-head) { animation: ccRise .5s cubic-bezier(.22,1,.36,1) both; animation-delay: .1s; }
.cc-enter .cc-graph { animation: ccRise .6s cubic-bezier(.22,1,.36,1) both; animation-delay: .16s; }
.cc-enter :is(.cc-break, .cc-rows, .cc-legend, .cc-tray) { animation: ccRise .5s cubic-bezier(.22,1,.36,1) both; animation-delay: .28s; }
/* expanding: what sits under the chart (stats, table, note) waits until the card has finished growing, then fades in where it
   belongs; the scrollbar's room is held from the start so nothing re-wraps as it comes and goes */
.cc-full .cc-body { scrollbar-gutter: stable; }

/* expanded: what's under the chart comes in as the card lands, the way the agents' list does: each part (the stats band, the
   header, every row, the note) fades and settles down from just above, top to bottom. Closing fades it out as one. */
@keyframes ccDrop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.cc-full .cc-more :is(.cc-stats, thead tr, tbody tr, .cc-note) { opacity: 0; }
.cc-full.is-ready .cc-more :is(.cc-stats, thead tr, tbody tr, .cc-note) { animation: ccDrop .32s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 28ms); }
.cc-full .cc-more { border-top-color: transparent; transition: border-color .3s ease, opacity .16s ease; }
.cc-full.is-ready .cc-more { border-top-color: #e2e2e2; }
