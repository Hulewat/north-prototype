.ar-c { display: flex; flex-direction: column; border: 0.5px solid #d3d3d3; border-radius: 8px; overflow: hidden; background: var(--paper); min-width: 0; }
.ar-c-b { padding: 16px 20px 8px; }
.ar-c-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.ar-c-h h5 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-c-h span { font-size: 13px; color: var(--mute); }
.ar-rows { margin: 0; padding: 0; list-style: none; }
.ar-rows li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto minmax(40px, auto); align-items: center; gap: 12px; min-height: 48px; padding: 8px 0; font-size: 14px; line-height: 20px; }
.ar-rows li + li { border-top: 0.5px solid var(--line); }
.ar-rows b { font-weight: 400; color: var(--ink); min-width: 0; }
.ar-rows li.is-now b, .ar-rows li.is-next b { font-weight: 500; color: var(--navy); }
.ar-rows li > span:not(.ar-f) { font-size: 13px; color: var(--mute); white-space: nowrap; }
.ar-rows em { font-style: normal; font-size: 13px; color: var(--mute); text-align: right; white-space: nowrap; }
.ar-rows li.is-now em { color: var(--navy); }
.ar-rows.is-team li { grid-template-columns: 24px minmax(0, 1fr) auto; min-height: 44px; }
.ar-rows.is-log li { grid-template-columns: 52px minmax(0, 1fr) 20px; min-height: 40px; }
.ar-rows.is-log time { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.ar-f { display: flex; }
.ar-ext { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--well); color: var(--mute); font-size: 11px; font-weight: 500; }
.ar-tray { min-height: 72px; padding: 12px 20px; }
.ar-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@container (max-width: 560px) { .ar-two { grid-template-columns: minmax(0, 1fr); } }
.ar-files { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 12px; }
.ar-files .fcard { margin: 0; max-width: none; }
.ar-note { margin: 0; font-size: 12px; line-height: 16px; color: var(--mute); }
.sdoc .fm-b, .fm .fm-b { container-type: inline-size; }
/* a deal's file: which deal, where it stands, and where this file is in its own review */
.ar-strip { display: flex; flex-direction: column; gap: 12px; margin: 0 0 22px; padding: 0 0 18px; border-bottom: 0.5px solid var(--line); }
.ar-strip p { margin: 0; font-size: 13px; line-height: 18px; color: var(--mute); } .ar-strip p b { font-weight: 500; color: var(--navy); }
.ar-flow { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 24px; }
.ar-flow li { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink); }
.ar-flow em { font-style: normal; font-size: 12px; color: var(--mute); }
.ar-flow li.is-now em { color: var(--navy); } .ar-flow li.is-next span { color: var(--mute); }
.doc-sec { margin: 4px 0 10px; padding: 0; list-style: none; max-width: 720px; }
.doc-sec li { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 0.5px solid var(--line); font-size: 14px; line-height: 20px; }
.doc-sec b { font-weight: 500; color: var(--navy); } .doc-sec span { color: var(--ink); }
.doc-sec em { font-style: normal; font-size: 13px; color: var(--mute); white-space: nowrap; } .doc-sec em.is-open { color: var(--navy); }
/* a narrow file (beside a conversation on a small screen): the name and its status share a line, what it is goes under */
.doc { container-type: inline-size; }
@container (max-width: 520px) { .doc-sec li { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; } .doc-sec li span { grid-column: 1 / -1; grid-row: 2; } .doc-sec li em { grid-row: 1; grid-column: 2; } }
.sdoc .doc, .sdoc .ar { max-width: none; }
/* K: comments on a file. In pick mode the file takes a crosshair; a note pins where you clicked (face + words on paper,
   a hairline and a soft real shadow, the one place a shadow is allowed: it floats over the file) */
.cm-wrap { position: relative; }
.cm-wrap.is-pick, .cm-wrap.is-pick * { cursor: crosshair !important; }
.cm-pin, .cm-draft { position: absolute; z-index: 5; display: flex; align-items: flex-start; gap: 8px; translate: -12px -12px; }
.cm-pin p { margin: 0; max-width: 240px; padding: 6px 10px; border-radius: 4px 12px 12px 12px; background: var(--paper); font-size: 13px; line-height: 18px; color: var(--navy);
  box-shadow: 0 0 0 0.5px rgba(9,53,85,.12), 0 6px 16px -6px rgba(9,53,85,.25); }
.cm-draft input { width: 260px; height: 34px; padding: 0 12px; border: 0; outline: 0; border-radius: 4px 12px 12px 12px; background: var(--paper); font: inherit; font-size: 13px; color: var(--navy);
  box-shadow: 0 0 0 0.5px rgba(9,53,85,.16), 0 8px 22px -8px rgba(9,53,85,.3); }
.cm-hint { position: sticky; bottom: 12px; z-index: 6; width: max-content; margin: 12px auto 0; padding: 6px 12px; border-radius: 14px; font-size: 12px; line-height: 16px; color: var(--navy);
  background: rgba(240,244,248,.6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 0 0.5px rgba(9,53,85,.1); }
/* voice, final: a small glass pill (40px tall, 440px wide), fixed under the page card's centre; it never moves or resizes
   while it's up. Inside: the wave (56×24 canvas), the line, a quiet ×. 14px type, one weight. The words flow left under a
   20px fade once the line is full. Glass = thin wash + heavy blur + a hairline + one soft shadow. */
.vx { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; z-index: 400; display: grid !important; grid-template-columns: 56px minmax(0, 1fr) 24px; align-items: center; gap: 12px;
  width: min(440px, calc(100vw - 32px)); min-width: 0 !important; max-width: none !important; height: 44px; min-height: 0 !important; padding: 0 10px 0 14px !important; border-radius: 20px; color: var(--navy);
  background: linear-gradient(162deg, rgba(240,244,248,.5), rgba(250,243,241,.56)) !important; -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7);
  box-shadow: 0 0 0 0.5px rgba(9,53,85,.1), 0 8px 24px -12px rgba(9,53,85,.28) !important; }
.vx-wave { display: block; width: 56px; height: 24px; }
.vx-mid { position: relative; height: 22px; min-width: 0; display: block !important; }
.vx-mid > * { position: absolute; inset: 0; margin: 0; }
.vx-said { display: block; }
.vx-line { position: relative; height: 22px; overflow: hidden; white-space: nowrap; }
.vx-line.is-over { -webkit-mask-image: linear-gradient(90deg, transparent, #000 20px); mask-image: linear-gradient(90deg, transparent, #000 20px); }
.vx-words { display: inline-flex; gap: 0.3em; font-size: 14px; line-height: 22px; color: var(--navy); will-change: transform; }
.vx-words span { display: inline-block; }
.vx-ph { display: inline-block; font-size: 14px; line-height: 22px; color: var(--mute); }
.vx-did { display: flex !important; align-items: center; gap: 8px; font-size: 14px; line-height: 22px; color: var(--navy); white-space: nowrap; overflow: hidden; }
.vx-did span { overflow: hidden; text-overflow: ellipsis; }
.vx-f { display: flex !important; flex-direction: row !important; align-items: center; gap: 12px; } /* "Play example" sits on the line, never under it */
.vx-f input { flex: 1; min-width: 0; height: 22px; padding: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 14px !important; line-height: 22px; color: var(--navy); }
.vx-f input::placeholder { color: var(--mute); }
.vx-ex { flex: none; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--navy); text-decoration: none !important; font-weight: 500; cursor: pointer; opacity: .8; }
.vx-ex:hover { opacity: 1; }
.vx-x { position: static !important; translate: none !important; display: grid; place-items: center; width: 24px !important; height: 24px !important; padding: 0 !important; border: 0; border-radius: 50% !important; background: transparent !important; color: var(--mute) !important; cursor: pointer; }
.vx-x:hover { background: rgba(9,53,85,.07) !important; color: var(--navy) !important; }
.vx[style*="translate: none"] { translate: none; }
/* account room, third pass: answer → what's left → folds. Rows share fixed columns (face 24 · step · who 88 · when 64),
   so every name and every Now/Next sits on one line down the card. */
.ar { gap: 20px; }
.ar-sub { margin: -6px 0 4px; }
.ar-hero { display: flex; flex-direction: column; gap: 16px; padding: 4px 0 6px; }
.ar-k { margin: 0; font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-hero h3 { margin: -10px 0 4px; font-size: 18px; line-height: 26px; font-weight: 500; color: var(--navy); text-wrap: balance; }
.ar-odds { display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 0.5px solid var(--line); font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-odds b { font-size: 18px; line-height: 24px; font-weight: 500; color: var(--navy); font-variant-numeric: tabular-nums; }
.ar-odds .ar-spark { width: 120px; height: 24px; flex: none; }
.ar-odds em { margin-left: auto; font-style: normal; color: var(--navy); }
.ar-rows li { grid-template-columns: 24px minmax(0, 1fr) 88px 64px; }
.ar-rows li > span:not(.ar-f) { text-align: left; }
.ar-rows.is-team li { grid-template-columns: 24px 88px 112px minmax(0, 1fr); }
.ar-rows.is-team em { text-align: left; white-space: normal; }
.ar-folds { display: flex; flex-direction: column; border-top: 0.5px solid var(--line); }
.ar-fold { border-bottom: 0.5px solid var(--line); }
.ar-fold-h { position: relative; display: grid; grid-template-columns: 140px minmax(0, 1fr) 12px; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
.ar-fold-h .chs-hover { z-index: 0; } .ar-fold-h > :not(.chs-hover) { position: relative; z-index: 1; }
.ar-fold-h b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-fold-s { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--mute); white-space: nowrap; overflow: hidden; }
.ar-fold-s > span { overflow: hidden; text-overflow: ellipsis; }
.ar-fold-b { overflow: hidden; } .ar-fold-b > div { padding: 0 0 12px; }
.ar-files { padding: 0; }
/* stages: one line, four stops. Reached = navy, now = coral, ahead = well; the line between fills as it goes */
.ar-stages { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.ar-stages li { position: relative; display: flex; flex-direction: column; gap: 2px; padding-top: 18px; min-width: 0; }
.ar-stages li::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; border-radius: 1px; background: var(--well); }
.ar-stages li.is-done::before { background: var(--navy); }
.ar-stages li:last-child::before { right: auto; width: 10px; }
.ar-stages i { position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--well); z-index: 1; }
.ar-stages li.is-done i { background: var(--navy); } .ar-stages li.is-now i { background: #e8664a; }
.ar-stages b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-stages li:not(.is-done):not(.is-now) b { color: var(--mute); font-weight: 400; }
.ar-stages small { font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-hero { gap: 12px; }
.ar-odds { padding-top: 6px; border-top: 0; gap: 8px; }
.ar-odds em { margin-left: auto; }
.ar-chart { width: 100%; overflow: hidden; }
.ar-chart svg { display: block; overflow: visible; }
.ar-chart { position: relative; overflow: visible; cursor: pointer; }
.ar-ltip { position: absolute; pointer-events: none; z-index: 5; }
.vx { height: auto; align-self: center; }
.vx-in { display: block; transform-origin: center; }
/* Files: the department page's header and rows; one row of kind filters beside "All files" (text tabs, the active one
   navy and medium, a count after each; no pills, no strokes) */
.fl .fl-body { margin-top: 40px; }
.fl-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 6px; }
.fl-bar .dh-sec { margin: 0; }
.fl-kinds { display: flex; gap: 18px; }
.fl-kinds button { display: inline-flex; align-items: baseline; gap: 5px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; line-height: 18px; color: var(--mute); cursor: pointer; }
.fl-kinds button span { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .7; }
.fl-kinds button.is-on { color: var(--navy); font-weight: 500; }
.fl-kinds button:hover { color: var(--navy); }
/* Files as pictures: each tile is the file itself (first slide, or first page at real size, scaled) in the graph tiles'
   well frame, then its name and one line. 16px between tiles, 20px between rows. Hover: the picture eases forward a hair. */
.fl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 24px 16px; }
.fl-grid.is-need { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.fl-tile { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: 100%; padding: 0; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
.fl-thumb { display: block; width: 100%; box-sizing: border-box; padding: 1.09px; border-radius: 8.74px; background: var(--well); overflow: hidden; }
.fl-thumb > div { border-radius: 7.65px; overflow: hidden; transition: transform .5s cubic-bezier(.32,.72,0,1); }
.fl-tile:hover .fl-thumb > div { transform: scale(1.015); }
.fl-thumb .sd-fit { border: 0; border-radius: 7.65px; }
.fp-page { position: relative; width: 100%; overflow: hidden; background: var(--paper); border-radius: 7.65px; }
.fp-scale { position: absolute; top: 0; left: 0; width: 640px; transform-origin: 0 0; pointer-events: none; }
.fp-doc { padding: 32px 36px; }
.fp-doc .fp-k { margin: 0 0 4px; font-size: 13px; color: var(--mute); }
.fp-doc h2 { margin: 0 0 24px; font-size: 30px; line-height: 36px; font-weight: 500; color: var(--navy); letter-spacing: -0.01em; }
.fl-t { display: flex; flex-direction: column; gap: 2px; padding: 0 2px; min-width: 0; }
.fl-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-t em { font-style: normal; font-size: 13px; line-height: 18px; color: var(--navy); }
.fl-t em.is-st { color: var(--ink); }
.fl-t small { font-size: 13px; line-height: 18px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-tile:hover .fl-t b { text-decoration: underline; text-decoration-thickness: 0.5px; text-underline-offset: 3px; }
.fl .dh-s + .dh-s { margin-top: 0; } /* the team pages’ own section gap (64) is the gap */
/* one callout everywhere, Home's own: a status reads in ink at 400 under a navy title ("Asked you" on Home's rows); where
   it sits (Waiting on you, the row that's now) carries the emphasis. No coloured text, no dots: coral is a chart mark only */
.fl-t em, .fl-t em.is-st { display: block; color: var(--ink); }
.fl-bar .seg { align-self: center; }
.ar-rows li.is-now em, .ar-flow li.is-now em, .doc-sec em.is-open { color: var(--ink); font-weight: 400; }
.ar-odds em { color: var(--mute); }
/* no coral dots or pills for "needs you" (Nov 10): Home's "7 need you" is ink after the title; in the chat a conversation
   waiting on you shows its name in navy 500 and a plain count, the way a mail client shows unread */
.fd-head h2 .fd-needn { margin-left: 10px; color: var(--mute); font-weight: 400; }
.sl-c { min-width: 0; height: auto; padding: 0; border-radius: 0; background: none; color: var(--navy); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chs-dot { display: none; }
.chs-u { color: var(--navy); }
.chat-shell .jw-st.is-need { color: var(--navy); font-weight: 500; }
/* account, fourth pass: the track (four equal 6px segments, 4px apart; done navy, now = Home's chart stripes on a pale
   navy, ahead = well), then "What's left" as hairline rows with no card around them, the sunk tray for your move, and the
   people on it as a quiet row of faces. One label style (13 mute) for every section. */
.ar-lab { margin: 0 0 6px; font-size: 13px; line-height: 18px; font-weight: 400; color: var(--mute); }
.ar-track { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; margin: 4px 0 0; padding: 0; list-style: none; }
.ar-track li { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ar-track i { display: block; height: 6px; margin-bottom: 10px; border-radius: 3px; background: var(--well); transform-origin: left center; }
.ar-track li.is-done i { background: var(--navy); }
.ar-track li.is-now i { background: repeating-linear-gradient(90deg, rgba(9,53,85,.55) 0 1px, transparent 1px 4px), #d9e1e8; }
.ar-track b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-track li.is-ahead b { font-weight: 400; color: var(--mute); }
.ar-track small { font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-track li.is-now small { color: var(--ink); }
.ar-left .ar-rows { border-top: 0.5px solid var(--line); }
.ar-left .ar-tray { margin-top: 12px; border-radius: 8px; border-top: 0; }
.ar-ppl ul { margin: 0; padding: 8px 0 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 20px; border-top: 0.5px solid var(--line); }
.ar-ppl li { display: flex; align-items: center; gap: 10px; min-width: 0; padding-top: 8px; }
.ar-ppl li > div { display: flex; flex-direction: column; min-width: 0; }
.ar-ppl b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-ppl span { font-size: 13px; line-height: 18px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar { gap: 32px; }
.ar-hero { gap: 12px; }
.ar-sub { margin: 0; }
.ar-block { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--ink); }
.ar-block b { margin-right: 8px; font-weight: 500; color: var(--navy); }

/* a file, in the Practice card's language (Figma 44:3311) but sized for a conversation: paper in a tray with a 1px rim,
   the icon beside what it is on the paper, where it stands on the tray. Hugs its title, 220–320 wide. */
.fcard { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0; width: 340px; max-width: 100%; margin-top: 10px; padding: 1px; border: 0; border-radius: 8px;
  background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; box-shadow: none; font: inherit; text-align: left; cursor: pointer; transition: none; }
.fcard:hover { background: var(--noise) 0 0 / 160px 160px repeat, var(--well); }
.fcard-s { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; border-radius: 7px; background: var(--paper); }
.fcard .fcard-i { flex: none; width: 20px; height: 20px; border-radius: 0; background: none; color: var(--ink); }
.fcard-t { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.fcard-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.fcard-t small { font-size: 13px; line-height: 18px; font-weight: 400; color: var(--ink); }
.fcard-f { padding: 6px 12px 7px 13px; font-size: 12px; line-height: 16px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-files .fcard { width: auto; max-width: none; }

/* Files page: the chart tile's anatomy (Home's .mt-clip): tray var(--well), 1.09 rim, r8.75; the file is the paper (r7.65);
   one footer line on the tray, 33.5 tall with 15.3 sides, like "pace $1.66M ··· 92%". Same size in both sections. */
.fl-grid.is-need { grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
.fl-tile { gap: 0; padding: 1.09px 1.09px 0; border-radius: 8.75px; background: var(--well); transition: background .25s; }
.fl-tile:hover { background: #e4e2df; }
.fl-tile .fl-thumb { position: relative; padding: 0; border-radius: 7.65px; background: none; }
.fl-tile:hover .fl-thumb > div { transform: none; }
.fl-go { position: absolute; top: 12px; right: 12px; color: var(--navy); opacity: 0; transform: translate(-3px, 3px); transition: opacity .25s, transform .4s cubic-bezier(.32,.72,0,1); }
.fl-tile:hover .fl-go { opacity: 1; transform: none; }
.fl-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 33.5px; padding: 0 15.3px; font-size: 13px; line-height: 18px; color: var(--ink); white-space: nowrap; transition: color .25s; }
.fl-f > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.fl-f small { flex: none; font-size: 13px; color: var(--mute); }
.fl-tile:hover .fl-f > span { color: var(--navy); }
.fl-tile:hover .fl-t b { text-decoration: none; }
.fl-t b, .fl-t em, .fl-t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-tile .fl-t b { font-size: 14px; line-height: 20px; }
.fl-tile .fl-t em, .fl-tile .fl-t em.is-st { font-size: 13px; line-height: 18px; color: var(--ink); }
.fl-tile .fl-t small { font-size: 12px; line-height: 16px; color: var(--mute); }

/* ACTIVE / FOCUS RULE (always): no state is ever shown with a stroke, ring or outline. Focus and active read as a fill:
   a soft navy tint on light things, a soft light on navy things. This wins over every earlier focus rule. */
:focus, :focus-visible { outline: none !important; }
:where(button, a, [role="button"], [role="tab"], [tabindex]):focus-visible { background-image: linear-gradient(rgba(9,53,85,.07), rgba(9,53,85,.07)); }
:where(.btn-pri, .cc-btn, .voice, .rt-b.is-pri, .seg .on, .gc-seg .is-on):focus-visible { background-image: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)); }
.hm-cell:focus-visible { box-shadow: inset 0 0 0 1px var(--paper); filter: brightness(.95); }
.chat-tool.chat-aim:focus-visible { box-shadow: none; background-color: rgba(116,76,203,.1); }
.chat-tool.chat-aim.is-on:focus-visible { box-shadow: inset 0 1px 1.5px rgba(255,255,255,.8), inset 0 -3px 7px rgba(70,40,150,.28); }
.chat-input:focus-within { box-shadow: none !important; }

/* Files: tiles ⇄ list, as on Agents. The view switch sits after the kinds, the same height (28) and frame as that control;
   the chosen view is a navy fill, never a stroke. The list's rows rise in one by one (4px, .45s, 22ms apart). */
.fl-bar { align-items: center; }
.fl-bar .seg { margin-left: auto; }
.fl-views { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 2.5px; box-sizing: border-box; border: 0.5px solid var(--edge); border-radius: 6px; background: var(--paper); }
.fl-views button { position: relative; display: grid; place-items: center; width: 26px; height: 23px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--mute); cursor: pointer; transition: color .2s, background-color .2s; }
.fl-views button:hover { color: var(--navy); }
.fl-views button.is-on { color: #fff; }
.fl-views .fl-vi { position: relative; z-index: 1; }
.fl-list { list-style: none; margin: 0; padding: 0; }
.fl-r { display: grid; grid-template-columns: 28px minmax(0, 1.4fr) minmax(0, 1fr) 132px; column-gap: 14px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; cursor: pointer; }
.fl-r .dh-fi { width: 28px; height: 28px; border-radius: 7px; background: var(--paper); } /* on the page an icon tile is paper (the tray is for on paper) */
.fl-r-t { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-r-m { font-size: 13px; line-height: 18px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-r-w { text-align: right; font-size: 13px; line-height: 18px; color: var(--mute); white-space: nowrap; font-variant-numeric: tabular-nums; }
@keyframes flIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.fl-swap.lv2-stg .fl-r { animation: flIn .45s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(min(var(--i, 0), 16) * 22ms + 20ms); }
@media (prefers-reduced-motion: reduce) { .fl-swap.lv2-stg .fl-r { animation: none; } }

/* Files: the kinds and the tiles/list switch set the whole page, so they sit across from the first section's heading.
   Every section heading row is the controls' height (28), so the tiles start the same distance under each heading;
   the first heading sits 44px under the header band. */
.fl .fl-body { margin-top: 72px; }
.fl-sh { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 28px; margin-bottom: 10px; }
.fl-sh .dh-sec { margin: 0; }
.fl-ctl { display: flex; align-items: center; gap: 8px; flex: none; }

/* Account, cleaned up: the name, one line about them, then the one number big (Home's hero size), the chart, and
   what's next as one row. Everything else (every step, who's on it, files, what's been done) folds, summary at the back. */
.sdoc .ar { gap: 28px; }
.ar-sub { margin: 0; }
.fm-b .ar-sub { display: none; } /* in an open file the line sits under the name, in the header */
.fm-h .fm-sub { margin: 6px 0 0; font-size: 14px; line-height: 20px; color: var(--mute); }
.ar-hero { gap: 14px; padding: 0; }
.ar-odds { display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 0; border: 0; }
.ar-odds-l { font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-odds b { font-size: 56px; line-height: 60px; font-weight: 400; letter-spacing: -0.03em; color: var(--navy); font-variant-numeric: tabular-nums; }
.ar-next .ar-lab { margin-bottom: 8px; }
.ar-nx { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 56px; padding: 10px 0; border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
.ar-nx-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ar-nx-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ar-nx-t small { font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-go { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border: 0; border-radius: 6px; background: var(--navy); color: #fefbf9; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.ar-did { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink); white-space: nowrap; }
.ar-folds { border-top: 0; }
.ar-fold-h { grid-template-columns: minmax(0, 1fr) auto 12px; }
.ar-fold-s { justify-content: flex-end; text-align: right; }
.ar-fold-b .ar-rows { border-top: 0.5px solid var(--line); }
.ar-rows.is-team li { grid-template-columns: 24px 88px 112px minmax(0, 1fr); }

/* a draft an agent wrote for you: it opens under your step, private, and sends as you */
.ar-draft { overflow: hidden; }
.ar-draft-in { display: flex; flex-direction: column; gap: 10px; padding: 14px 0 4px 40px; }
.ar-draft-h { display: flex; justify-content: space-between; gap: 12px; margin: 0; font-size: 13px; line-height: 18px; color: var(--mute); }
.ar-draft-h em { font-style: normal; }
.ar-draft textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 0; border-radius: 8px; background: var(--well); font: inherit; font-size: 14px; line-height: 21px; color: var(--navy); resize: vertical; outline: none; }
.ar-draft textarea:focus { background: #e8e6e3; }
.ar-draft-a { display: flex; align-items: center; gap: 8px; }
.ar-q { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13px; color: var(--mute); cursor: pointer; transition: color .2s; }
.ar-q:hover { color: var(--navy); }
.ar-undo { margin: 6px 0 0 28px; }

/* Home's work, simplified (audit round 2): the topic leads (14 medium navy), one grey line under it says who and where it
   stands (13 regular); the faces carry who's in it. Two sizes, two colours. The row's button is quiet navy text until
   you're on the row, so only one navy button shows at a time. What's moving folds into one quiet line. */
.fd-row-w > .fd-row-1 { display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-row-w .fd-row-s, .fd-row-w .fd-row-s em, .fd-row-w .fd-row-s b { font-size: 13px; line-height: 18px; font-weight: 400; font-style: normal; color: var(--mute); }
.fd-row-w .fd-row-s em { margin: 0; }
.fd-row.is-quiet .fd-row-w > .fd-row-1 { font-size: 14px; line-height: 20px; font-weight: 500; }
.fd-act { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--sec); color: var(--navy); /* the Secondary button (navy at 7%): reads as a button, not a title */ font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color .2s, color .2s; }
/* the card's buttons are outline buttons: the card already frames the work, a filled button would shout over it */
.fd-act { background: transparent !important; box-shadow: inset 0 0 0 1px rgba(9,53,85,.22); }
.fd-row:hover .fd-act, .fd-act:focus-visible { background: var(--sec) !important; color: var(--navy); }
/* the summary rows ("2 more need you", "In progress") are rows in the same list: same grid, height, divider and hover */
.fd-sum { width: 100%; border: 0; border-bottom: 0; background: none; font: inherit; text-align: left; color: inherit; }
.fd-sum .fd-row-a { color: var(--mute); min-width: 0; padding-right: 12px; }
.fd-going .fd-row-a svg { transition: transform .35s cubic-bezier(.32,.72,0,1); }
.fd-going.is-open .fd-row-a svg { transform: rotate(180deg); }
/* one text field on screen: with a Home item open, the top ask steps away (Esc closes the item and it comes back) */
.topbar .composer { transition: opacity .25s; }
.home-item-open .topbar .composer { opacity: 0; pointer-events: none; }

/* account: plain titles; one Steps list (your step, the rest on ask); dividers run the panel's full width (the fm-b 32px gutter) */
.ar-lab-r { display: flex; align-items: baseline; justify-content: space-between; }
.ar-lab-r em { font-style: normal; }
.fm-b .ar :is(.ar-nx, .ar-step, .ar-fold) { margin-left: -32px; margin-right: -32px; padding-left: 32px; padding-right: 32px; }
.ar-next .ar-nx { border-bottom: 0; }
.ar-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; column-gap: 12px; min-height: 56px; padding: 10px 0; border-top: 0.5px solid var(--line); }
.ar-step .ar-nx-t b { font-weight: 400; color: var(--ink); }
.ar-step.is-now .ar-nx-t b { color: var(--navy); }
.ar-all { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0; border: 0; border-top: 0.5px solid var(--line); background: none; font: inherit; font-size: 13px; line-height: 18px; color: var(--mute); cursor: pointer; transition: color .2s; }
.fm-b .ar .ar-all { display: flex; width: calc(100% + 64px); margin: 0 -32px; padding: 0 32px; }
.ar-all:hover { color: var(--navy); }
.ar-folds .ar-fold:first-child { border-top: 0.5px solid var(--line); }
/* the agent's face stays visible: the agent button is the light secondary, never navy behind a dark face */
.ar-go.is-agent { background: var(--sec); color: var(--navy); padding-left: 8px; }
.ar-go.is-agent::before { display: none; }
.ar-go.is-agent:hover { background: rgba(9,53,85,.12); transform: none; box-shadow: none; }

/* an open file's top: the controls share the first line with the small "who · kind · status" line, so the name below runs the
   full width (no two-line title squeezed beside the icons) */
.fm-h { display: block; position: relative; padding: 18px 32px 16px; }
.fm-h .fm-act { position: absolute; top: 14px; right: 20px; }
/* the eyebrow and the controls share the first row (the eyebrow ends where the controls begin, at any width or number of
   controls); the title and its line under it take the full width below */
.fm-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: center; }
.fm-h > div:first-child { display: contents; }
.fm-h .fm-act { position: static; grid-column: 2; grid-row: 1; margin-right: -12px; }
.fm-h > div:first-child > :not(.fm-eye) { grid-column: 1 / -1; }
.fm-h .fm-eye { grid-column: 1; grid-row: 1; display: block; min-height: 0; margin: 0; font-size: 13px; line-height: 28px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-h h2 { margin-top: 6px; }
.fm-back { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 7px; background: none; font: inherit; color: var(--navy); cursor: pointer; vertical-align: top; }

.fm-eye .fm-sep { display: inline-block; vertical-align: middle; margin: 0 10px 0 4px; }
/* who's doing what on a file, as rows (face, step, where it stands), dividers the panel's full width */
.fm-b .ar-strip { gap: 10px; margin: 0 -32px 22px; padding: 0; border-bottom: 0; }
.fm-b .ar-strip > p { padding: 0 32px; }
.fm-b .ar-flow { display: block; }
.fm-b .ar-flow li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 44px; padding: 0 32px; border-top: 0.5px solid var(--line); font-size: 14px; line-height: 20px; }
.fm-b .ar-flow li:last-child { border-bottom: 0.5px solid var(--line); }
/* the steps at the end of a file ("Before it goes") sit in the file's own column, on the same edges as the rows above */
.fm-b .doc .ar-flow { margin: 4px 0 0; } .fm-b .doc .ar-flow li { padding: 0; } .fm-b .doc .ar-flow li:first-child { border-top: 0; }
.fm-b .ar-flow em { font-size: 13px; }
.fm-b .ar-flow li.is-next span { color: var(--ink); }

/* the "needs you" count in the sidebar: a plain number like the team scores beside it, never a coral badge */
.nav-need { min-width: 0; height: auto; padding: 0 2px; background: none !important; color: var(--navy) !important; font-size: 13px !important; font-weight: 500 !important; border-radius: 0; }

/* routine, edited in place: fields inside the card, Save and Cancel in the tray (no swap, no flash) */
.rt-form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.rt-f { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; column-gap: 12px; }
.rt-f.is-top { align-items: start; }
.rt-fl { font-size: 13px; line-height: 18px; color: var(--mute); }
.rt-f.is-top .rt-fl { padding-top: 7px; }
.rt-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; justify-self: start; padding: 2px; border-radius: 8px; background: var(--sec); }
.rt-seg button { position: relative; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; transition: color .2s; }
.rt-seg button > span:not(.rt-seg-p) { position: relative; z-index: 1; }
.rt-seg button.is-on { color: var(--navy); }
.rt-seg-p { position: absolute; inset: 0; border-radius: 6px; background: #fefbf9; } /* paper on the tray: selected without competing with Save */
.rt-notes { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.rt-notes li { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; font-size: 14px; line-height: 20px; color: var(--navy); border-bottom: 0.5px solid var(--line); }
.rt-notes li .ibtn { color: var(--mute); }
.rt-add input { width: 100%; height: 32px; padding: 0; border: 0; background: none; font: inherit; font-size: 14px; color: var(--navy); outline: none; }
.rt-add input::placeholder { color: var(--mute); }
.rt-notes li.rt-add { border-bottom: 0; }

.ch-about { margin: 4px 0 18px; }
.fx-rel b { font-weight: 500; }

.ar-odds-n { display: flex; align-items: baseline; gap: 14px; } /* the number and, once you act, where it's headed beside it: no jump */
.ar-odds em { margin: 0; font-style: normal; font-size: 13px; line-height: 18px; color: #098486; } /* once you act: where it is now headed, in the line's colour */

/* ---- an opened item that's moving, done, or a routine: the work on the left, what the left doesn't show on the right ---- */
.gw-item:has(> .fx-b.fx-split), .gw-item:has(.rx-set.is-full) { container: gwi / inline-size; }
.gw-item .fx-b.fx-split { display: grid; grid-template-columns: minmax(0, 1fr) 292px; column-gap: 56px; align-items: start; padding-top: 4px; }
.gw-item .fx-b.fx-split > * { max-width: none; }
.fx-main { min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 18px; }
.rx-set { display: flex; flex-direction: column; gap: 22px; padding: 2px 0 8px 28px; box-shadow: inset 0.5px 0 0 var(--line); }
.rx-l { margin: 0 0 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.rx-run { display: flex; flex-direction: column; gap: 26px; }
.rx-sec { display: flex; flex-direction: column; }
.rx-lead { margin: 0; font-size: 15px; line-height: 24px; color: var(--ink); max-width: 60ch; }
.rx-lead b, .rx-p b, .rx-cap b { font-weight: 600; color: var(--navy); }
.rx-p { margin: 0; font-size: 14px; line-height: 22px; color: var(--ink); max-width: 60ch; }
.rx-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rx-steps li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 36px; font-size: 14px; line-height: 20px; color: var(--ink); }
.rx-steps li + li { box-shadow: inset 0 0.5px 0 var(--line); }
.rx-steps li.is-done { color: var(--mute); }
.rx-steps li.is-next { color: var(--mute); }
.rx-steps li.is-next > :first-child { opacity: .45; }
.rx-steps li em { font-style: normal; font-size: 12px; font-weight: 500; display: inline-flex; color: var(--mute); }
.rx-steps li.is-done em { color: var(--teal, #098486); }
.rx-steps li.is-now em { color: var(--navy); }
.rx-steps.is-sm li { grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 10px; min-height: 30px; font-size: 13px; line-height: 18px; padding-block: 5px; }
.rx-steps.is-sm li + li { box-shadow: none; }
.rx-dot { width: 16px; height: 16px; display: grid; place-items: center; color: var(--teal, #098486); }
.rx-steps li:not(.is-done) .rx-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--edge); }
.rx-steps li.is-now .rx-dot::before { background: var(--navy); }
.rx-risks, .rx-kit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rx-risks li { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 0; }
.rx-risks li + li, .rx-kit li + li { box-shadow: inset 0 0.5px 0 var(--line); }
.rx-risk-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--ink); }
.rx-risk-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.rx-risk-t small { margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--navy); }
.rx-kit li { display: grid; grid-template-columns: 20px minmax(0, 1fr) 20px; align-items: start; column-gap: 14px; padding: 12px 0; }
.rx-kit li > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--mute); }
.rx-kit li > div b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); transition: color .2s; }
.rx-kit li.is-done > div b { color: var(--mute); text-decoration: line-through; text-decoration-thickness: 1px; }
.rx-kit.is-ro li { grid-template-columns: 72px minmax(0, 1fr); }
.rx-due { font-size: 13px; line-height: 20px; font-weight: 500; color: var(--navy); }
.rx-chk { width: 18px; height: 18px; margin-top: 1px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: transparent; box-shadow: inset 0 0 0 1px rgba(9,53,85,.3); color: #fff; cursor: pointer; transition: background .2s, box-shadow .2s; }
.rx-chk:hover { background: var(--sec); }
.rx-chk[aria-pressed="true"] { background: var(--navy); box-shadow: none; }
.rx-deck { display: flex; flex-direction: column; align-items: stretch; width: min(100%, 560px); padding: 1px; border: 0; border-radius: 8px; background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; text-align: left; font: inherit; cursor: pointer; }
.rx-deck-s { display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 12px; border-radius: 7px; background: var(--paper); }
.rx-deck-t { display: flex; flex-direction: column; padding: 0 2px; }
.rx-deck-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.rx-deck-t small { font-size: 13px; line-height: 18px; color: var(--ink); }
.rx-deck-th { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rx-deck-th > span { display: block; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 0.5px var(--line); transition: transform .5s cubic-bezier(.32,.72,0,1); }
.rx-deck:hover .rx-deck-th > span { transform: translateY(-2px); }
.rx-deck:hover .rx-deck-th > span:nth-child(2) { transition-delay: 30ms; } .rx-deck:hover .rx-deck-th > span:nth-child(3) { transition-delay: 60ms; } .rx-deck:hover .rx-deck-th > span:nth-child(4) { transition-delay: 90ms; }
.rx-deck-f { padding: 6px 12px 7px 13px; font-size: 12px; line-height: 16px; color: var(--mute); }
.rx-bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; max-width: 520px; }
.rx-bar { flex: 1; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; font: inherit; cursor: default; transition: opacity .2s; }
.rx-bar.is-dim { opacity: .4; }
.rx-bar-c { position: relative; flex: 1; width: 100%; align-self: stretch; }
.rx-bar-c i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; background: var(--well); }
.rx-bar-c b { position: absolute; left: 30%; right: 30%; bottom: 0; border-radius: 2px; background: var(--navy); }
.rx-bar small { font-size: 11px; line-height: 14px; color: var(--mute); text-align: center; }
.rx-cap { margin: 10px 0 0; font-size: 13px; line-height: 18px; color: var(--ink); min-height: 18px; }
.rx-set-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rx-set-h .rt-e { margin: 0; }
.rx-set.is-full .rx-set-h { flex-direction: row-reverse; justify-content: flex-end; }
.rx-saved { font-size: 13px; line-height: 18px; color: var(--teal, #098486); }
.rx-onoff button { height: 24px; padding: 0 10px; font-size: 12px; }
.rx-about { margin: 0; font-size: 14px; line-height: 22px; color: var(--ink); }
.rx-dl { margin: 0; display: flex; flex-direction: column; gap: 16px; transition: opacity .3s; }
.rx-set.is-off .rx-dl, .rx-set.is-off .rx-runs { opacity: .5; }
.rx-dl dt { margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.rx-dl dd { margin: 0; font-size: 13px; line-height: 20px; color: var(--navy); }
.rx-ul { list-style: none; margin: 0; padding: 0; }
.rx-crew { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rx-crew li { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--mute); min-width: 0; }
.rx-crew li b { font-weight: 500; color: var(--navy); }
.rx-seg { display: flex; flex-direction: column; align-items: stretch; width: 100%; }
.rx-seg button { height: auto; min-height: 30px; padding: 5px 10px; text-align: left; line-height: 18px; }
.rx-notes li { font-size: 13px; min-height: 30px; }
.rx-notes input { width: 100%; height: 30px; border: 0; outline: 0; background: none; font: inherit; font-size: 13px; color: var(--navy); padding: 0; }
.rx-acts { display: flex; gap: 8px; margin: -4px 0 0; padding: 0; }
.rx-runs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rx-runs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 7px 0; font-size: 12px; line-height: 16px; color: var(--mute); }
.rx-runs li + li { box-shadow: inset 0 0.5px 0 var(--line); }
.rx-runs li b { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); }
.rx-runs li span { grid-row: 2; }
.rx-runs li small { grid-row: 1; grid-column: 2; font-size: 12px; }
.rx-move { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 18px; color: var(--ink); }
.rx-move b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.rx-moves span { color: var(--mute); }
.rx-q { color: var(--mute); margin-top: -10px; }
.rx-crew li > span { color: var(--navy); }
@container gwi (max-width: 860px) { .gw-item .fx-b.fx-split { grid-template-columns: minmax(0, 1fr); row-gap: 28px; } .rx-set { position: static; padding-left: 0; box-shadow: none; } }

/* ---- Files: the saved-charts board (Beyonce's Home) holding files. The tray carries the file card's texture ---- */
.fl-board { margin-top: 40px; }
.fl-board .board-head h3 { font-size: 16px; font-weight: 500; color: var(--navy); }
.fl-of { color: var(--mute); font-weight: 400; }
.fl-board .card { background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; }
.fl-board .board-body { grid-template-columns: minmax(0, 700fr) minmax(0, 400fr); }
.fl-board .detail-surface { height: auto; min-height: 520px; border-radius: 7px 0 0 0; }
.fl-board .card.list { position: relative; }
.fl-board .list-surface { position: absolute; inset: 1px; overflow-y: auto; border-radius: 0 7px 7px 0; scrollbar-width: thin; }
.fl-open { display: flex; flex-direction: column; padding: 20px 22px 22px; }
.fl-eye { margin: 0 0 4px !important; font-size: 13px !important; line-height: 18px !important; color: var(--mute) !important; }
.fl-open h4 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; color: var(--navy); }
.fl-say { margin: 8px 0 20px !important; max-width: 56ch; font-size: 15px !important; line-height: 24px !important; color: var(--ink) !important; text-wrap: pretty; }
.fl-pv { position: relative; display: block; width: min(100%, 600px); padding: 1px; border-radius: 8px; background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; cursor: pointer; outline: none; }
.fl-pv-s { border-radius: 7px; overflow: hidden; background: var(--paper); }
.fl-pv .fl-go { z-index: 2; }
.fl-pv:hover .fl-go, .fl-pv:focus-visible .fl-go { opacity: 1; transform: none; }
.fl-open .fl-say { margin: 0 0 22px; max-width: 54ch; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -0.005em; color: var(--navy); text-wrap: pretty; }
/* ---- covers: a file's art, drawn from what it holds (16:9, on paper, on the textured tray) ---- */
.cv { position: relative; aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 30px 26px; box-sizing: border-box; }
.cv-num { display: flex; flex-direction: column; gap: 4px; }
.cv-num b { font-size: 40px; line-height: 44px; font-weight: 500; letter-spacing: -0.02em; color: var(--navy); font-variant-numeric: tabular-nums; }
.cv-num span { font-size: 14px; line-height: 20px; color: var(--ink); }
.cv-rep { justify-content: center; gap: 30px; }
.cv-meter { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 8px)); justify-content: start; gap: 4px; height: 44px; align-items: end; padding-top: 22px; cursor: default; }
.cv-meter i { display: block; height: 22px; border-radius: 1px; background: var(--edge); transition: background .2s, transform .25s cubic-bezier(.22,1,.36,1); transform-origin: bottom; }
.cv-meter i.is-lit { background: var(--navy); }
.cv-meter i.is-mark { height: 30px; background: var(--teal, #098486); }
.cv-meter i.is-hv { transform: scaleY(1.25); }
.cv-meter.is-count { grid-template-columns: repeat(var(--n), minmax(0, 14px)); gap: 6px; }
.cv-meter.is-count i { height: 30px; border-radius: 2px; }
.cv-mark-l { position: absolute; top: 0; transform: translateX(-100%); padding-right: 2px; font-style: normal; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--teal, #098486); white-space: nowrap; }
.cv-parts { justify-content: center; gap: 22px; }
.cv-row { display: grid; grid-template-columns: repeat(var(--c, 4), minmax(0, 1fr)); gap: 8px; }
.cv-row.is-2 { --c: 2; } .cv-row.is-4 { --c: 4; }
.cv-part { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cv-part-m { display: grid; place-items: center; height: 92px; border-radius: 6px; background: var(--sec); color: var(--navy); transition: background .2s; }
.cv-part.is-done .cv-part-m { background: rgba(9,53,85,.06); color: var(--teal, #098486); }
.cv-part.is-open .cv-part-m, .cv-part.is-wait .cv-part-m { background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; }
.cv-part.is-hv .cv-part-m { background-color: rgba(9,53,85,.14); }
.cv-part small { font-size: 12px; line-height: 16px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-part.is-open small, .cv-part.is-wait small { color: var(--navy); font-weight: 500; }
.cv-sum { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink); min-height: 20px; }
.cv-days { justify-content: center; gap: 30px; }
.cv-line { position: relative; height: 64px; }
.cv-track { position: absolute; left: 8%; right: 8%; top: 14px; height: 0; border-top: 1.6px dotted rgba(9,53,85,.35); }
.cv-day { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .3s cubic-bezier(.22,1,.36,1); }
.cv-day.is-hv { transform: translateX(-50%) translateY(-3px); }
.cv-day small { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--navy); }
.cv-svg { display: block; width: 100%; height: auto; overflow: visible; }
.cv-acct .cv-svg { margin-top: 8px; }
.cv-slide, .cv-page { padding: 0; }
.cv-slide > *, .cv-page > * { width: 100%; height: 100%; }
.cv-strip { flex-direction: row; flex-wrap: wrap; align-content: center; gap: 10px; padding: 24px; }
.cv-strip > span { width: calc(50% - 5px); border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 0.5px var(--line); }
.fl-foot { height: 40px !important; padding: 0 8px 0 14px !important; font-size: 13px !important; color: var(--mute); }
.fl-foot .is-mine { color: var(--navy); font-weight: 500; }
.fl-acts { display: flex; align-items: center; gap: 4px; }
.fl-acts .fd-act { height: 28px; }
.fl-o { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13px; font-weight: 500; color: var(--navy); cursor: pointer; transition: background .2s; }
.fl-o:hover { background: var(--sec); }
.fl-grp { margin: 8px 12px 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.fl-grp.is-2 { margin-top: 18px; }
.fl-list-s .row { height: 56px; }
.fl-list-s .row-l b { font-size: 14px; line-height: 20px; color: var(--navy); }
.fl-list-s .row-l small { font-size: 12px; line-height: 16px; }
.fl-list-s .row-r small.fl-mine { color: var(--navy); font-weight: 500; font-size: 12px; }
.fl-list-s .fl-grp + .row::before { display: none; }
@media (max-width: 900px) { .fl-board .board-body { grid-template-columns: minmax(0, 1fr); } .fl-board .card.list { position: static; } .fl-board .list-surface { position: static; } .fl-board .detail { border-radius: 8px 8px 0 0; } }

/* the demo buttons stay out of the way: they show only with #demos on the link */
:root:not(.show-demos) .demo-land { display: none !important; }
/* an opened item fills the window from under "Your work": the page doesn't scroll under it, so it can't ride up over the bar */
html.home-item-open .main .scroll { overflow: hidden !important; }

/* a file open beside the full chat: its own controls (comment, expand, collapse) are the set; the chat's (watching, history,
   close) step out until it's gone, the same rule as an opened item on Home */
.chat-shell.has-doc .chat-head > :is(.wl-wrap, button, .ibtn, .ch-ctl, .chat-ctl) { visibility: hidden; }

/* a run: one line at the end names its routine and opens it */
.rx-from { display: flex; align-items: center; gap: 8px; align-self: flex-start; max-width: 660px; margin-top: 8px; padding: 10px 14px 10px 10px; border: 0; border-radius: 8px; background: rgba(9,53,85,.05); font: inherit; font-size: 13px; line-height: 18px; color: var(--ink); text-align: left; cursor: pointer; transition: background .2s; }
.rx-from:hover { background: var(--sec); }
.rx-from .rt-mk { flex: none; }
.rx-from b { flex: none; margin-left: 6px; font-weight: 500; color: var(--navy); }
/* the routine, opened on its own: what it is and its settings on the left, its runs on the right */
.rx-set-a { display: flex; flex-direction: column; gap: 22px; }
.rx-set.is-full { display: grid; grid-template-columns: minmax(0, 1fr) 320px; column-gap: 56px; align-items: start; padding: 4px 0 8px; box-shadow: none; max-width: 1040px; }
.rx-set.is-full .rx-set-a { max-width: 560px; }
.rx-set.is-full .rx-about { font-size: 15px; line-height: 24px; }
.rx-set.is-full .rx-runs { padding-left: 28px; box-shadow: inset 0.5px 0 0 var(--line); }
.rx-runs li { display: block !important; padding: 0 !important; }
.rx-run-b { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; width: 100%; padding: 8px 8px; margin: 0 -8px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 12px; line-height: 16px; color: var(--mute); text-align: left; }
button.rx-run-b { cursor: pointer; transition: background .2s; }
.rx-run-b b { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); }
.rx-run-b span { grid-row: 2; } .rx-run-b small { grid-row: 1; grid-column: 2; font-size: 12px; }
.rx-run-b em { grid-row: 2; grid-column: 2; font-style: normal; font-size: 12px; font-weight: 500; color: var(--navy); text-align: right; }
.rx-runs li + li { box-shadow: inset 0 0.5px 0 var(--line); }
@container gwi (max-width: 860px) { .rx-set.is-full { grid-template-columns: minmax(0, 1fr); row-gap: 28px; } .rx-set.is-full .rx-runs { padding-left: 0; box-shadow: none; } }

/* ---- what needs you, by whose it really is */
.nc-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 16px 6px; }
.nc-h p { margin: 0; font-size: 15px; line-height: 22px; color: var(--ink); }
.nc-h b { font-weight: 500; color: var(--navy); }
.nc-l { margin: 14px 16px 2px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.fd-due { font-weight: 500; color: var(--navy); }
.fd-act.is-let { box-shadow: inset 0 0 0 1px rgba(9,132,134,.45) !important; color: #076a6c; }
.fd-act.is-let:hover { background: rgba(9,132,134,.1) !important; }
.nc-tk { display: inline-flex; gap: 3px; align-items: center; }
.nc-tk i { width: 3px; height: 12px; border-radius: 1px; background: var(--navy); }
.nc-tk i.is-take { background: var(--teal, #098486); }
.fd-nc-f { justify-content: flex-start; gap: 12px; }
.fd-nc-f span:last-child { color: var(--ink); }

.fd-mv-more { align-self: flex-start; margin: 2px 0 6px calc(15.1px + 44px + 26px); padding: 4px 0; border: 0; background: none; font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); cursor: pointer; }
.fd-mv-more:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 0.5px; }
/* Sam's Home arrives the way Beyonce's does (the intro's own timings): the greeting drops in, then the ask, then the work
   settles in from a touch larger, then what's moving, then the number */
@keyframes nDrop { from { opacity: 0; transform: translateY(-12px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes nSettle { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
.home-page.is-field .fd-band .hello { animation: nDrop .9s cubic-bezier(.22,1,.36,1) .12s both; }
.home-page.is-field .fd-band .home-ask { animation: nDrop .9s cubic-bezier(.22,1,.36,1) .24s both; }
.home-page.is-field .fd-head { animation: nDrop .9s cubic-bezier(.22,1,.36,1) .4s both; }
.home-page.is-field .fd-nc { animation: nSettle 1.2s cubic-bezier(.16,1,.3,1) .55s both; transform-origin: 50% 0; }
.home-page.is-field .fd-mv { animation: nSettle 1.2s cubic-bezier(.16,1,.3,1) .75s both; transform-origin: 50% 0; }
.home-page.is-field .fd-nums { animation: nSettle 1.25s cubic-bezier(.16,1,.3,1) .9s both; transform-origin: 50% 0; }
@media (prefers-reduced-motion: reduce) { .home-page.is-field :is(.hello, .home-ask, .fd-head, .fd-nc, .fd-mv, .fd-nums) { animation: none !important; } }

/* ---- Files: one list to find a file by. Each row carries the file's cover, small, on the textured tray */
.fl2 { margin-top: 40px; }
.fl2-ctl { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.fl2-q { display: flex; align-items: center; gap: 8px; width: min(100%, 320px); height: 34px; padding: 0 12px; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 0.5px var(--edge); color: var(--mute); }
.fl2-q:focus-within { box-shadow: inset 0 0 0 0.5px #aaa49d; }
.fl2-q input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font: inherit; font-size: 14px; color: var(--navy); }
.fl2-q input::placeholder { color: var(--mute); }
.fl2-list { list-style: none; margin: 0; padding: 0; }
.fl2-list li { animation: flIn .45s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(min(var(--i, 0), 16) * 22ms + 20ms); }
.fl2-list li + li .fl2-r::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; border-top: 0.5px solid var(--line); }
.fl2-r { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; align-items: center; column-gap: 18px; width: calc(100% + 24px); margin: 0 -12px; padding: 10px 12px; border: 0; border-radius: 8px; background: none; font: inherit; text-align: left; cursor: pointer; transition: background .2s; }

.fl2-r:hover::before, .fl2-list li:hover + li .fl2-r::before { opacity: 0; }
.fl2-th { position: relative; display: block; width: 112px; aspect-ratio: 16 / 9; padding: 1px; border-radius: 6px; background: var(--noise) 0 0 / 160px 160px repeat, var(--well); background-blend-mode: soft-light, normal; overflow: hidden; }
.fl2-th-in { position: absolute; left: 1px; top: 1px; width: 560px; transform: scale(calc(110 / 560)); transform-origin: 0 0; border-radius: 26px; overflow: hidden; background: var(--paper); pointer-events: none; }
.fl2-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fl2-t b { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl2-t small { font-size: 13px; line-height: 18px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl2-w { font-size: 13px; line-height: 18px; white-space: nowrap; }
.fl2-w em { font-style: normal; font-weight: 500; color: var(--navy); }
.fl2-in { color: var(--mute); opacity: 0; transition: opacity .2s; }
.fl2-r:hover .fl2-in { opacity: 1; }
@media (max-width: 640px) { .fl2-r { grid-template-columns: 80px minmax(0, 1fr); } .fl2-th { width: 80px; } .fl2-th-in { transform: scale(calc(78 / 560)); } .fl2-w { display: none; } .fl2-ctl { flex-wrap: wrap; } }

/* ---- handing work to an agent: the agent's face waits by the button; on Let, a teal sweep runs across the row from the
   button (the agent taking it), the line says who has it, and the row flies down into In progress */
.fd-let { display: inline-flex; align-items: center; gap: 10px; }
.fd-let-f { display: inline-flex; opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .35s cubic-bezier(.22,1,.36,1); }
.fd-row:hover .fd-let-f { opacity: 1; transform: none; }
.fd-row > .fd-take, .fd-take { position: absolute; inset: 0; z-index: 0; border-radius: 8px; background: linear-gradient(90deg, rgba(9,132,134,.04), rgba(9,132,134,.12)); transform: scaleX(0); transform-origin: right center; opacity: 0; pointer-events: none; }
.fd-take.is-on { opacity: 1; transform: scaleX(1); transition: transform .52s cubic-bezier(.32,.72,0,1), opacity .2s; }
.fd-row > .fd-take ~ * { position: relative; z-index: 1; }
.fd-took { display: inline-flex; align-items: center; gap: 5px; color: #076a6c; font-weight: 500; }
.fd-ghost { border-radius: 8px; background: var(--paper); overflow: hidden; display: grid; align-items: center; }
.fd-ghost .fd-take { opacity: 1; transform: none; }
.fd-ghost .fd-let { display: none; }
/* landed in In progress: a soft teal wash that fades, so you can see where it went */
.fd-mv-r.is-fresh { animation: mvFresh 2.6s cubic-bezier(.22,1,.36,1) both; }
@keyframes mvFresh { 0%, 35% { background: rgba(9,132,134,.10); } 100% { background: transparent; } }

/* a routine opened on Agents: the same opened-item box as Home, fixed over the page's card */
.fd-open.rt-sheet { position: fixed; z-index: 60; }
.rt-veil { position: fixed; z-index: 59; border-radius: 14px; background: rgba(236,238,242,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: none; }
.rt-sheet .gw-item { --face-col: 62px; }
.rt-faces { display: inline-flex; } .rt-faces > * + * { margin-left: -8px; }
.rt-back { margin-right: 10px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); cursor: pointer; }
.rt-back + b { padding-left: 10px; box-shadow: inset 0.5px 0 0 var(--line); }
/* Sam's Home: the header texture takes the band's height at once (easing it from the last page's height drew the
   pattern across the card for a moment as the page came in) */
.home-page.is-field .hw-wrap { transition: none; }

/* in the card, a row's hover (and the hand-off sweep) runs the card's full width, edge to edge of the paper, and the last
   row's runs to the paper's bottom; the paper clips it to its own corners */
.fd-rows.fd-nc-p { overflow: hidden; }
.fd-nc-p > .fd-row .chs-hover, .fd-nc-p > .fd-row > .fd-take { margin: 0 -14px; border-radius: 0; }
.fd-nc-p > .fd-row:last-child .chs-hover, .fd-nc-p > .fd-row:last-child > .fd-take { margin-bottom: -4px; }

/* Beyonce's Home: the tiles in one row (her numbers first); opened, the row makes room on the tile's curve */
.top.is-lead { display: block; margin-top: 56px; }
.top.is-lead .kgrid { align-self: start; }
/* her Q4 goals: tiles on the number tiles' foundation (they open the same way). Opened, the right panel is the goal's moves */
.home-page > .gq-h { margin: 64px 0 0; font-size: 20px; line-height: 26px; font-weight: 500; letter-spacing: -0.005em; color: var(--navy); }
.gq-h small { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--mute); letter-spacing: 0; }
.top.is-lead.is-goals { margin-top: 16px; }
/* Q4 goals: a header that says where the quarter stands, the goals 2×2 on the left, what needs her on the right */
.gq-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 64px; }
.gq-head .gq-h { margin: 0; font-size: 20px; line-height: 26px; font-weight: 500; letter-spacing: -0.005em; color: var(--navy); }
.gq-head > span { font-size: 14px; line-height: 20px; color: var(--ink); }
.home-page > .top.is-lead.is-goals { margin-top: 16px; }
/* leadership's ARR movement as the scoreboard's hero: fills its three columns and two rows, Total ARR's number under the title */
.k-hero { min-width: 0; display: flex; }
.k-hero .card.arr { flex: 1; min-width: 0; }
.k-hero .card-foot { flex: none; } /* the footer keeps its 36px; the plot gives way, never the footer */
.k-hero .arr-plot { margin-top: auto; }
.arr-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }

.gq-log { display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 0; border-top: 0.5px solid var(--line); }
.gq-n { display: flex; gap: 10px; margin: 0; font-size: 13px; line-height: 18px; color: var(--ink); }
.gq-n > :first-child { flex: none; }
.gq-me { align-self: flex-end; max-width: 85%; margin: 0; padding: 7px 11px; border-radius: 10px; background: rgba(9,53,85,.06); font-size: 13px; line-height: 18px; color: var(--navy); }
@media (max-width: 699px) {
  .mtile.is-goal .mt-inner { grid-template-columns: minmax(0, 1fr); grid-template-rows: 400px minmax(0, 1fr); }
  .mtile.is-goal .mo-r { border-left: 0; border-top: 0.5px solid var(--line); }
  .mtile.is-goal .mt-seg { right: 24px !important; }
}
.gq-av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; background-size: cover; background-position: center; }
.gq-idea { display: flex; gap: 8px; align-items: center; margin: 8px 24px 16px; padding: 4px 4px 4px 12px; border-radius: 8px; background: rgba(9,53,85,.04); }
.gq-idea input { flex: 1; min-width: 0; height: 30px; border: 0; background: none; font: inherit; font-size: 13px; color: var(--navy); outline: none; }
.gq-idea input::placeholder { color: var(--mute); }
.gq-idea .fd-act:disabled { opacity: .4; cursor: default; }
.gq-link { padding: 0; border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--navy); cursor: pointer; white-space: nowrap; }
.gq-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* board covers: the cover is the whole section, in the board's chart language on paper; title over it, the breakdown rises on
   hover, a click opens it */
.board.is-docs .board-body .detail-surface { height: 440px; min-height: 440px; }
.detail-inner.is-cover { position: absolute; inset: 0; padding: 0; }
.board.is-docs .detail-inner:not(.is-cover) { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
.board.is-docs .detail-inner:not(.is-cover) > :last-child { margin-top: auto; } /* a chart on the taller board sits on its floor, like the covers */
.bcv { position: absolute; inset: 0; overflow: hidden; cursor: zoom-in; outline: none; background: var(--paper); }
.bcv-art { position: absolute; inset: 0; width: 100%; height: 100%; font-family: inherit; transition: transform .6s cubic-bezier(.22,1,.36,1); }
.bcv.is-hv .bcv-art { transform: translateY(-34px); } /* the art lifts to make room for the breakdown rising under it */
.bcv-head { position: relative; z-index: 1; padding: 16px 64px 0 16px; max-width: 640px; pointer-events: none; } /* the Saved Charts' title inset */
.bcv-head h4 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--navy); }
.bcv-head p { margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--ink); }
.bcv-parts { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 16px; display: grid; margin: 0; padding: 14px 0; list-style: none; border-radius: 10px;
  background: #fff; box-shadow: inset 0 0 0 1px #ededed, 0 8px 24px rgba(9,53,85,.06); }
.bcv-parts li { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 0 18px; font-size: 13px; line-height: 18px; }
.bcv-parts li + li { border-left: 0.5px solid var(--line); }
.bcv-parts span { color: var(--mute); }
.bcv-parts em { font-style: normal; color: var(--navy); font-weight: 500; }
.bcv-parts em.is-ok { color: #098486; } .bcv-parts em.is-need { color: #b1042f; }
.bcv-dots { display: inline-flex; gap: 3px; padding-top: 2px; } .bcv-dots b { width: 4px; height: 14px; border-radius: 1px; background: #6d4fc2; }
.bcv-dots b.is-n { background: #c9bfe8; } .bcv-dots b.is-o { background: #fefbf9; box-shadow: inset 0 0 0 0.5px #d3d3d3; }
@media (max-width: 699px) { .board.is-docs .board-body .detail-surface { height: 340px; min-height: 340px; } .bcv-head { padding: 16px 52px 0 16px; } .bcv-head h4 { font-size: 18px; line-height: 24px; } .bcv-parts { display: none; } }

/* the goal panel as status: who has each move and what's happening now (the tick meter); a move still waiting on her call
   says so and points to Needs you, where it's decided, once */
.gq-mv.is-track { grid-template-columns: 22px minmax(0, 1fr) auto; cursor: pointer; }
.gq-mv.is-track .fd-mk { align-self: start; margin-top: 5px; }
.gq-mv.is-wait .gq-d, .gq-mv.is-gone .gq-d { color: var(--mute); }
.gq-mv.is-gone .gq-t { color: var(--ink); }
.gq-act { align-self: start; flex: none; height: 30px; padding: 0 12px; background: transparent; box-shadow: inset 0 0 0 1px rgba(9,53,85,.22); white-space: nowrap; transition: background-color .2s; } .gq-act:hover { background: var(--sec); } /* cards take outline buttons */
.gq-call { align-self: start; margin-top: 1px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--navy); white-space: nowrap; }
.gq-mv.is-track .gq-mv-w { padding-right: 0; }
/* Needs you: set a decision aside (it stays on its goal, restorable there) */
.nd-x { flex: none; width: 24px; height: 24px; margin-left: -4px; color: var(--mute); opacity: 0; transition: opacity .2s, color .2s; }
.nd-in:hover .nd-x, .nd-x:focus-visible { opacity: 1; }
.nd-x.is-sp { visibility: hidden; pointer-events: none; } /* rows without it keep its space, so every button lines up */ .nd-x:hover { color: var(--navy); }
@media (hover: none) { .nd-x { opacity: 1; } }

/* a dash she asked North for: first on her Home, in the tiles' language; four tiles divided by full-height lines */
.cd { overflow: hidden; }
.cd-in { padding: 44px 0 0; } /* the same 44px the ARR card sits below the band */
.cd-head h3 span { margin-left: 10px; font-size: 13px; font-weight: 400; color: var(--mute); }
.cd-card { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px #ededed; }
.cd-t { display: flex; flex-direction: column; min-width: 0; padding: 18px 20px 16px; }

.cd-l { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.cd-b { margin-top: 6px; font-size: 36px; line-height: 40px; font-weight: 400; letter-spacing: -0.03em; color: var(--navy); }
.cd-c { margin-top: 16px; height: 96px; } .cd-c svg { display: block; width: 100%; height: 96px; overflow: visible; }
.cd-f { margin-top: 12px; font-size: 13px; line-height: 18px; color: var(--mute); }
.cd-tip { position: absolute; z-index: 3; transform: translate(-50%, calc(-100% - 8px)); padding: 6px 10px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 12px; line-height: 16px; white-space: nowrap; pointer-events: none; }
@media (max-width: 899px) { .cd-card { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cd-t:nth-child(3) { border-left: 0; } .cd-t:nth-child(n+3) { border-top: 0.5px solid var(--line); } .cd-head h3 span { display: block; margin: 2px 0 0; } }

.nd-foot { display: flex; align-items: baseline; gap: 20px; }
.nd-aside { font-size: 13px; line-height: 18px; color: var(--mute); }
.nd-aside button { margin-left: 8px; padding: 0; border: 0; background: none; font: inherit; font-weight: 500; color: var(--navy); cursor: pointer; } .nd-aside button:hover { text-decoration: underline; text-underline-offset: 3px; }

.bf-ev { align-self: flex-start; margin: 10px 0 0; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; line-height: 19px; font-weight: 600; color: #737373; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.bf-ev:hover { color: var(--navy); }

/* her morning, split like Sam's: what's hers, what an agent can take (teal), and the morning in ticks at the foot */
.nd-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 52px 6px 20px; } /* right edge: the rows' buttons (20px inset + the 24px set-aside slot + its 8px gap) */
.nd-h p { margin: 0; font-size: 15px; line-height: 22px; color: var(--ink); }
.nd-h b { font-weight: 500; color: var(--navy); }
.nd-l { margin: 18px 20px 2px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.nd-a .rt-b.is-let { box-shadow: inset 0 0 0 1px rgba(9,132,134,.45); color: #076a6c; }
.rt-b.is-let > .hv-fill { background: rgba(9,132,134,.1); } /* an agent-take button grows its own teal from the cursor */
.nd-foot { margin-top: 10px; padding: 0 20px; gap: 12px; align-items: center; font-size: 13px; line-height: 18px; }
.nd-tk { display: inline-flex; gap: 3px; align-items: center; } .nd-tk i { width: 3px; height: 12px; border-radius: 1px; background: var(--navy); } .nd-tk i.is-take { background: #098486; }
.nd-sum { color: var(--ink); }
/* the rest, in one line under the top three: more of hers, and what an agent can take (with the one button that hands them over) */
.nd-rest { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 4px 52px 0 20px; }
