/* a chart open full size: the chat's own controls (Watching, dock, close) step back, so the only way out is the chart's own */
.chat-shell .chat-head :is(.ibtn, .wl-btn, .wl-wrap) { transition: opacity .2s ease; }
.chat-shell.has-ccfull .chat-head :is(.ibtn, .wl-btn, .wl-wrap) { opacity: 0; pointer-events: none; }
/* the ring, opened: bigger, and the ring and its legend sit together in the middle of the card rather than off in a corner */
.cc-full.is-big .cc-ring { grid-template-columns: 340px auto; justify-content: center; gap: 72px; }

/* the account row is a button now (the prototype's "view as"): the menu grows up out of it */
.acct-wrap { position: relative; }
/* the face never gives way to the name beside it; folded to the rail, the name takes no room and the face sits on the icons' centre line (rows are 40 wide) */
.acct .avatar { flex: none; }
.is-rail .side .acct { width: 40px; padding-left: 6px; padding-right: 6px; gap: 0; }
.is-rail .side .acct > div { width: 0; min-width: 0; overflow: hidden; white-space: nowrap; }
button.acct { width: 100%; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer; border-radius: 10px; color: inherit; }
button.acct.is-open { background: rgba(9,53,85,.04); }
.acct .avatar, .acct-o .avatar { display: inline-grid; place-items: center; font-size: 11px; font-weight: 500; color: var(--navy); letter-spacing: .02em; }
.acct-m { position: absolute; left: -2px; right: -2px; bottom: calc(100% + 6px); z-index: 40; display: flex; flex-direction: column; gap: 2px; padding: 6px;
  background: #fff; border-radius: 12px; box-shadow: 0 0 0 0.5px rgba(9,53,85,.1), 0 12px 32px -12px rgba(9,53,85,.22); transform-origin: 50% 100%; }
/* folded to the rail, the menu keeps its full width and grows out past the rail instead of squeezing into it */
.is-rail .side .acct-m { position: fixed; left: 10px; right: auto; bottom: 76px; width: 220px; } /* the rail scrolls, so it would clip an absolute menu. 76px = the account row's top (70px up from the window's foot, measured) + the same 6px gap the open sidebar uses */
/* ARR movement: a page of its own. The ledger leads, under its filters; Home's own bar chart follows at full width. Nothing is
   boxed; hairlines (strokes) do the separating. Hover is the sidebar's: soft pills opening out of the cursor, one along the row,
   one down the month. Two type sizes per block */
.card-head-r { display: inline-flex; align-items: center; gap: 8px; }
.arr-open { color: var(--navy); }
/* no band: like Company health, the page opens straight onto its own ground, so the empty top bar reads as nothing */
.content.ch-open::before { display: none; }
.am-head { margin-top: 56px; }
.am { position: relative; }
/* ARR movement over Home: a file opened full screen's frame */
.ao { position: fixed; z-index: 3001; overflow: hidden; border-radius: 16px; background: var(--paper); box-shadow: inset 0 0 0 1.09px var(--well); will-change: clip-path; }
.ao-in { position: relative; height: 100%; }
.ao-scroll { height: 100%; width: 100%; overflow: auto; overscroll-behavior: contain; box-sizing: border-box; padding: 64px 56px 72px; }
.ao .am-back { display: none; } /* the frame carries its own, in the corner */
.ao-x { position: absolute; top: 20px; right: 20px; z-index: 2; width: 32px; height: 32px; color: var(--navy); }
.am-back { position: absolute; top: 0; right: 0; width: 32px; height: 32px; color: var(--navy); z-index: 3; }
/* the three numbers: Home's tiles, one row of three. Opened, the row makes room for the open chart (the tile fills the region) */
.am .top.is-arr { margin-top: 40px; overflow: visible; }
.am .top.is-arr .kgrid { align-self: start; }
/* no top bar here: nothing lives in it on this page, so it isn't drawn, and the page scrolls clean to the top edge (its 64px
   is given back to the page as padding, so the header sits where it did) */
.topbar.is-bare { position: absolute; left: 0; right: 0; top: 0; z-index: 6; border-bottom: 0; pointer-events: none; }
.topbar.is-bare::before { display: none; }
.content.ch-open { padding-top: 64px; }
.am-head h1 { margin: 0; font-size: 40px; line-height: 49px; font-weight: 600; letter-spacing: -0.005em; color: var(--navy); }
.am-lead { margin: 12px 0 0; max-width: 820px; font-size: 16px; line-height: 22px; color: var(--ink); text-wrap: pretty; }
/* the filters: the Agents list's own row. Quiet value-only dropdowns on a hairline, text on the content edge (the button's
   10px inset is pulled back), the status on the right */
.am-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 48px 0 0; padding: 0 0 12px; border-bottom: 1px solid #e2e2e2; scroll-margin-top: 88px; }
.am-bar > .am-dd:first-child { margin-left: -10px; }
.am-bar-st { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--mute); }
.am-dd { position: relative; }
.am-dd-b { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px; border-radius: 5px; font-size: 12.5px; font-weight: 500; color: #545454; transition: background-color .15s, color .15s; }
.am-dd-b.is-open { background: rgba(9,53,85,.043); color: #232528; }
.am-dd-b svg { color: #8a8a8a; transition: transform .2s; } .am-dd-b.is-open svg { transform: rotate(180deg); }
/* the menu opens out of its own button: the button's shape grows into the menu, then the options settle in */
.am-dd-m { position: absolute; top: 0; left: 0; z-index: 40; min-width: 210px; padding: calc(var(--bh) + 4px) 4px 4px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 0.5px #d3d3d3, 0 16px 32px -16px rgba(9,53,85,.35); display: flex; flex-direction: column; animation: amUnit .62s cubic-bezier(.16,1,.3,1) both; }
.am-dd-m > button { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 32px; padding: 0 10px; border-radius: 5px; font-size: 12.5px; font-weight: 500; color: var(--navy); text-align: left; animation: menuIn .34s .14s cubic-bezier(.22,1,.36,1) both; transition: background-color .15s; }
.am-dd-m > button.is-on { background: rgba(9,53,85,.05); }
.am-dd-m em { font-style: normal; font-weight: 400; color: #8a8a8a; font-variant-numeric: tabular-nums; }
.am-dd:has(.am-dd-m) .am-dd-b { position: relative; z-index: 41; background: transparent; }
@keyframes amUnit { from { clip-path: inset(0 calc(100% - var(--bw)) calc(100% - var(--bh)) 0 round 5px); } to { clip-path: inset(-40px -40px -40px -40px round 10px); } }
/* filtering: as on the Agents list, the old view eases out and the new one arrives row by row (each row's delay is its place) */
@keyframes amIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.am-stg .am-in { animation: amIn .45s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(min(var(--i, 0), 16) * 22ms + 20ms); }
@media (prefers-reduced-motion: reduce) { .am-stg .am-in, .am-dd-m, .am-dd-m > button { animation: none; } }
.am-fine { margin: 18px 0 0; max-width: 90ch; font-size: 12px; line-height: 17px; color: var(--mute); }
.am-sec-b { position: relative; z-index: 2; margin-top: 56px; }
.am-sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.am-sec-h h3 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 500; letter-spacing: -0.005em; color: var(--navy); }
.am-sw-l { width: 14px; height: 0; border-top: 1.5px solid var(--navy); }
.am-sw-l.is-felix { border-top-color: #6d4fc2; } /* Felix purple, as the line (C.purple) */
.am-sw-l.is-plan { border-top: 1.5px dotted rgba(9,53,85,.6); }
.am-chart .arr-plot { margin-top: 6px; } /* the title sits on its chart: the plot's own top label is the first thing under it */
.am-chart .legend { justify-content: flex-start; margin: 14px 0 0; font-size: 12px; }
/* the ledger */
.am-tbl-wrap { position: relative; overflow-x: auto; margin-top: 4px; }
.am-bands { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.am-band { position: absolute; border-radius: 6px; background: rgba(9,53,85,.05); }
.am-tbl { position: relative; z-index: 1; width: 100%; min-width: 960px; border-collapse: separate; border-spacing: 0; font-size: 12.5px; line-height: 17px; font-variant-numeric: tabular-nums; }
.am-tbl th, .am-tbl td { padding: 8px 7px; text-align: right; white-space: nowrap; border-bottom: 0.5px solid var(--line); font-weight: 400; transition: color .18s; }
.am-tbl thead th { font-size: 11.5px; color: var(--mute); }
.am-tbl .am-grp th { padding: 8px 7px 2px; border-bottom: 0; font-size: 11.5px; font-weight: 500; color: var(--ink); text-align: left; }
.am-tbl .am-grp th.is-live, .am-tbl .am-grp th.is-plan { padding-left: 12px; }
.am-tbl th[scope="row"], .am-tbl thead tr:last-child th:first-child { padding-left: 10px; text-align: left; color: var(--ink); }
/* the names only stay put on phones, where the ledger has to scroll sideways */
@media (max-width: 700px) { .am-tbl th[scope="row"], .am-tbl thead tr:last-child th:first-child { position: sticky; left: 0; z-index: 1; background: var(--paper); } }
@media (max-width: 700px) { .am-tbl tr.is-hr th[scope="row"] { background: linear-gradient(rgba(9,53,85,.05), rgba(9,53,85,.05)), var(--paper); } }
.am-tbl th[scope="row"] small { margin-left: 5px; font-size: 11px; color: var(--mute); }
.am-tbl td { color: var(--navy); }
.am-tbl tr.is-in th[scope="row"] { padding-left: 24px; }
.am-tbl tr.is-neg td { color: var(--ink); }
.am-tbl tr.is-total th[scope="row"], .am-tbl tr.is-total td { font-weight: 500; color: var(--navy); }
.am-tbl td.is-plan, .am-tbl thead th.is-plan { color: var(--mute); }
/* the kind of month is in the numbers themselves, so no labels over them: measured months dark grey at regular, the month
   still moving salmon at semibold, plan months light grey. The year is already in the filter above */
.am-tbl td, .am-tbl tr.is-neg td, .am-tbl tr.is-total td { color: #1f1f1f; }
.am-tbl tr.is-total td { font-weight: 500; }
.am-tbl td.is-live, .am-tbl tr.is-neg td.is-live, .am-tbl tr.is-total td.is-live, .am-tbl thead tr:last-child th.is-live { color: #ff725c; font-weight: 600; }
.am-tbl td.is-plan, .am-tbl tr.is-total td.is-plan, .am-tbl tr.is-neg td.is-plan, .am-tbl thead th.is-plan { color: #a3a3a3; font-weight: 400; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* the row and the month you're on read in navy (the pills do the rest) */
.am-tbl tr.is-hr th[scope="row"], .am-tbl tr.is-hr td, .am-tbl :is(th, td).is-hi { color: var(--navy); }
/* where the ledger turns live, then plan: a hairline, not a shaded column */
.am-tbl tr > .is-live, .am-tbl tr > .is-plan:not(.is-plan + .is-plan):not(.is-live + .is-plan) { border-left: 0.5px solid var(--line); }
.am-tbl tr > .is-live + .is-plan { border-left: 0.5px solid var(--line); }
.am-tbl .am-trend { padding-left: 16px; text-align: left; }
.am-tbl .am-trend svg { display: block; overflow: visible; }
.am-tbl .am-sec th { padding: 22px 0 6px 10px; text-align: left; font-size: 12px; font-weight: 500; color: var(--ink); position: static; background: none; }
@media (max-width: 900px) { .am-bar-st { margin-left: 0; width: 100%; } }
/* arranging Home by hand: while a tile is carried, nothing selects and the cursor holds it. No shadow: it rides above the others
   and they make room under it */
.is-arranging, .is-arranging * { user-select: none !important; cursor: grabbing !important; }
.is-arranging :is(.chat-aim-label, .chat-aim-ring) { opacity: 0 !important; transition: opacity .12s; } /* the "ask about this" hint and its ring stay out of the way while you carry a tile */
.acct-m-h { padding: 6px 8px 4px; font-size: 11.5px; color: #8a8a8a; }
.acct-o { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; font: inherit; text-align: left; cursor: pointer; color: var(--navy); }
.acct-o > span:not(.nav-hover) { position: relative; z-index: 1; min-width: 0; }
.acct-o .avatar { flex: none; }
.acct-o small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-o b { display: block; font-size: 13px; font-weight: 400; line-height: 16px; }
.acct-o.is-on b { font-weight: 600; }
.acct-o small { display: block; font-size: 12px; line-height: 15px; color: #7f7f7f; }

/* a seat's goals: its own first, the team's quieter; one line ties it to the team's number */
.goal.is-team .goal-l b { color: #7f7f7f; font-weight: 400; }
.goal-tie { margin: 0; padding: 8px 14px 0; border-top: 0.5px solid var(--line); font-size: 12px; line-height: 16px; color: #7f7f7f; }

/* a pin by name: the way back (or the choices), as quiet pills under North's one line */
.ch-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ch-opts button { height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(9,53,85,.06); color: var(--navy); font-size: 12.5px; transition: background .2s; }
.ch-opts button:hover { background: rgba(9,53,85,.11); }
.chat-toast.is-page { position: fixed; bottom: 32px; z-index: 60; }

/* a job you set in motion landed: pushed out of the sidebar's edge beside Agents */
.efly.job-fly { width: 320px; }
.job-fly .jf { display: flex; flex-direction: column; padding: 2px 2px 4px; }
.job-fly .jf-h { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 0.5px solid var(--line); animation: wpInH .3s cubic-bezier(.22,1,.36,1) both; animation-delay: .16s; }
.job-fly .jf-h > .jf-l { flex: 1; text-align: left; font-size: 12px; line-height: 16px; color: #7f7f7f; }
.job-fly .jf-open { align-self: flex-start; margin-top: 8px; height: 26px; padding: 0 12px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 500; cursor: pointer; transition: background .2s; }
.job-fly .jf-open:hover { background: #1b4a6d; }
.job-fly .jf-x { position: relative; display: grid; place-items: center; width: 26px; height: 26px; margin-right: -2px; border-radius: 6px; color: #7f7f7f; cursor: pointer; transition: color .2s; }
.job-fly .jf-x:hover { color: var(--navy); }
.job-fly .jf-t { margin: 0; padding-top: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); animation: wpInX .42s cubic-bezier(.32,.72,0,1) both; animation-delay: .2s; }
.job-fly .jf-open { animation: wpInX .42s cubic-bezier(.32,.72,0,1) both; animation-delay: .24s; }
.job-fly .ag-pk-in { padding: 8px 0 2px; }
.ag-pk-b { display: flex; gap: 2px; margin-left: auto; } .ag-pk-b button { margin-left: 0 !important; }
.job-fly .ag-pk-f { flex-wrap: wrap; row-gap: 6px; } .job-fly .ag-pk-b { width: 100%; margin-left: -9px; }
.ag-pk-f button.is-on { color: var(--navy); font-weight: 600; }
.job-fly .jf-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* a batch: one row per thing that came in; each opens in place */
.job-fly .jf-orbs { display: flex; } .job-fly .jf-orbs > * + * { margin-left: -4px; }
.job-fly .jf-list { list-style: none; margin: 0; padding: 4px 0 0; }
.job-fly .jf-list li { display: block; height: auto; padding: 0; border-radius: 0; font-weight: 400; cursor: default; border-bottom: 0.5px solid var(--line); } .job-fly .jf-list li:hover { background: none; } .job-fly .jf-list li:last-child { border-bottom: 0; }
.job-fly .jf-row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 4px; border-radius: 6px; text-align: left; cursor: pointer; animation: wpInX .42s cubic-bezier(.32,.72,0,1) both; animation-delay: .2s; }
.job-fly .jf-row > .jf-rt { flex: 1; text-align: left; min-width: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); }
.job-fly .jf-list .jf-row { align-items: flex-start; } .job-fly .jf-list .jf-row > :first-child { margin-top: 3px; } /* the face sits on the title's line, not between the lines */
.job-fly .jf-row > em { font-style: normal; font-size: 12px; color: #7f7f7f; }
.job-fly .jf-list .ag-pk-in { padding: 0 4px 8px 24px; }
/* ready for you: the quiet place work waits, beside Agents */
.nav-ready { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(9,53,85,.07); color: var(--navy); font-size: 11.5px; font-weight: 500; cursor: pointer; transition: background .2s; position: relative; z-index: 1; }
.nav-ready:hover { background: rgba(9,53,85,.13); }
.nav-ready i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy); }
/* counts: just the number, navy, the same for Agents (work ready for you) and Watching (only when something you watch changed).
   On the rail it sits at the icon's top-right corner, clear of the glyph; in the sidebar, at the row's right edge */
.side .nav-ready { margin-left: auto; height: auto; min-width: 0; padding: 0 2px; background: none !important; border-radius: 0; color: var(--navy); font-size: 12px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums; }
.side .nav-ready i, .side .nav-ready span { display: none; }
.side .nav-watch-n { margin-left: auto; color: var(--navy) !important; font-size: 12px; font-weight: 600 !important; font-variant-numeric: tabular-nums; }
.is-rail .side .nav-ready, .is-rail .side .nav-row.is-watch .nav-watch-rail { position: absolute; top: 3px !important; left: calc(50% + 9px) !important; translate: none; height: auto; min-width: 0; padding: 0; margin: 0;
  background: none !important; box-shadow: none; border-radius: 0; color: var(--navy) !important; font-size: 10px !important; font-weight: 700 !important; line-height: 12px !important; font-variant-numeric: tabular-nums; }
/* a job opened anywhere: the Agents job view over the page */
.agx.jm-host .jm-stage.pg { max-width: none; margin: 0; padding: 0; }
.agx.jm-host { position: fixed; inset: 0; z-index: 96; background: transparent; color: inherit; overflow: visible; border-radius: 0; pointer-events: none; display: block; }
.agx.jm-host .jm-scrim { position: fixed; inset: 0; background: rgba(9,53,85,.10); pointer-events: auto; }
.agx.jm-host .stg2.jm-stage { position: static; background: transparent !important; height: auto !important; min-height: 0 !important; }
.agx.jm-host .cd.jm-card { position: fixed; z-index: 2; max-height: calc(100vh - 120px); display: flex; flex-direction: column; overflow: hidden; pointer-events: auto; background: var(--paper, #fefbf9); border: 0.5px solid var(--line); border-radius: 14px; }
.agx.jm-host .cd.jm-card .cd-pane { overflow: auto; }
/* beside the docked chat: the job takes the page card's frame (the same frame a chart's full view uses) */
.agx.jm-host .cd.jm-card.jm-beside { max-height: none; border-radius: 16px; }
.agx.jm-host .cd.jm-card.jm-beside .cd-talk, .agx.jm-host .cd.jm-card.jm-pair .cd-talk { display: none; } /* the chat beside it is where you talk: one field on screen */
.agx.jm-host .cd.jm-card.jm-beside .cd-cols > .cd-body { border-right: 0; }
/* a job's header, everywhere: who and where it stands on the left; share, full screen, more and close on the right, as navy icons */
.cd-h .cd-acts { margin: 0 -4px 0 auto !important; flex: none; display: inline-flex; align-items: center; align-self: center; gap: 2px; }
.cd-h > .cd-state.is-v { margin-left: 2px; } .cd-h > .cd-state.is-v .cd-v { margin: 0; }
.cd-h .cd-acts .cd-ib { display: grid; place-items: center; width: 28px; height: 28px; margin: 0 !important; padding: 0; border-radius: 7px; background: none; color: var(--f1, #093555); cursor: pointer; transition: background .15s; }
.cd-h .cd-acts .cd-ib:hover, .cd-h .cd-acts .cd-ib.is-on { background: var(--chip, rgba(9,53,85,.06)); color: var(--f1, #093555); }
.cd-h .cd-hand, .cd-h .cd-hand .rc-hand, .cd-h .cd-hand .rc-acts, .cd-h .cd-hand .rc-add { display: inline-flex; align-items: center; gap: 0; margin: 0; position: relative; }
.cd-h .cd-hand .rc-addm { left: auto !important; right: 0; }
.cd-h .cd-hand .rc-note { position: absolute; right: 0; top: calc(100% + 6px); white-space: nowrap; font-size: 12px; color: var(--f3); }
.cd-h > .cd-state { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; font-size: 12px; line-height: 16px; color: var(--f3); white-space: nowrap; min-width: 0; }
.cd-h > .cd-state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
.cd-h .cd-v { margin-left: 4px; font-style: normal; color: var(--f3); }
.cd-h > .cd-who { flex: 0 1 auto; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--f1, #093555); }
.jm-step { display: flex; align-items: center; justify-content: center; gap: 10px; height: 36px; flex: none; border-bottom: 0.5px solid var(--line); font-size: 12px; color: #7f7f7f; }
.jm-step button { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--navy); cursor: pointer; }
.jm-step button:hover { background: rgba(9,53,85,.07); } .jm-step button:disabled { opacity: .3; cursor: default; background: none; }
/* prototype control: see a job land */
.demo-land { position: fixed; top: 28px; right: 32px; z-index: 90; height: 28px; padding: 0 12px; border-radius: 14px; background: var(--sec); color: var(--navy); font-size: 12px; font-weight: 500; cursor: pointer; transition: background .2s; }
.demo-land:hover { background: rgba(9,53,85,.12); }

/* one subject, one surface: a question asked while work is open beside the chat builds on that work */
.cd-adds { display: flex; flex-direction: column; }
.cd-add { position: relative; padding: 26px 20px 8px; border-radius: 14px; transition: background-color .6s ease; scroll-margin-top: 12px; }
.cd-add::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 1px; background: var(--hl); }
.cd-add-q { margin: 0 0 12px; font-size: 12px; line-height: 17px; color: var(--f3); }
.cd-add-q q { color: var(--f1); font-weight: 500; quotes: "“" "”"; }
.cd-add > .cc { max-width: 760px; }
.cd-add.is-found { animation: cd-add-found 1.4s ease; }
@keyframes cd-add-found { 0% { background-color: rgba(9,53,85,0); } 18% { background-color: rgba(9,53,85,.05); } 100% { background-color: rgba(9,53,85,0); } }
.ch-jref { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; margin: 12px 0 2px; padding: 10px 12px; border: 0; border-radius: 12px; background: rgba(9,53,85,.04); color: var(--f1); text-align: left; cursor: pointer; font: inherit; }
.ch-jref-i { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #fff; color: var(--f2); }
.ch-jref-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ch-jref-t b { font-size: 13px; line-height: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-jref-t small { font-size: 12px; line-height: 16px; color: var(--f3); }
.ch-jref-a { flex: none; color: var(--f2); }

/* the chat as a job's thread: its header names who owns the work and the work */
.chat-head .ch-jt { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chat-head .ch-jt b { font-weight: 600; color: var(--navy); flex: none; }
.chat-head .ch-jt span:last-child { font-size: 13px; color: var(--f3, #7a8794); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* quiet by default: the Watch offer is only made in full screen, where there's room beside the chart; never over a chart in the pop-out or dock */
.chat-shell:not(.is-full) .ob-tip { display: none !important; }

/* ready list: each row says what was done and what came out of it, so you know what to look at before opening it */
.job-fly .jf-row > .jf-rt b { display: block; padding: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-fly .jf-row > .jf-rt small { display: block; font-size: 12px; line-height: 17px; font-weight: 400; color: #5f6f7d; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.is-rail .side .nav-watch-n { display: none; }

/* the two counts line up: same box, same right edge, same baseline */
.side:not(.x) .nav-ready, .side:not(.x) .nav-watch-n { display: inline-flex; justify-content: flex-end; align-items: center; align-self: center; min-width: 16px; height: 16px; padding: 0 !important; margin: 0 0 0 auto !important; line-height: 16px; font-size: 12px; font-weight: 600 !important; color: var(--navy) !important; text-align: right; }
.is-rail .side:not(.x) .nav-watch-n { display: none; }
.is-rail .side:not(.x) .nav-ready { position: absolute; top: 3px !important; left: calc(50% + 9px) !important; min-width: 0; height: 12px; line-height: 12px; font-size: 10px; font-weight: 700 !important; justify-content: flex-start; }

/* the work at the top of its own conversation: title, where it stands, the chart, what came out. Quiet frame, no card chrome */
.chat-shell .ch-work { padding: 4px 0 18px; margin-bottom: 6px; border-bottom: 1px solid rgba(9,53,85,.08); }
.chat-shell .jw { background: none !important; }
.chat-shell .jw-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.chat-shell .jw-st { display: inline-flex; align-items: center; gap: 6px; } .chat-shell .jw-st i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
.chat-shell .jw-h b { font-size: 15px; line-height: 21px; font-weight: 600; color: var(--navy); }
.chat-shell .jw-st { font-size: 12px; line-height: 16px; color: rgba(9,53,85,.5); white-space: nowrap; }
.chat-shell .jw-st.is-need { color: var(--coral, #e8604c); }
.chat-shell .jw-viz { margin: 0 -2px; }
/* a job's running-total ticks, in a thread on any page (the Agents page's own sheet only reaches its own page) */
.chat-shell .jw { --trk: #e2e7ec; }
.chat-shell .jw .jv { width: 100%; margin-top: 4px; } .chat-shell .jw .jv svg { display: block; overflow: visible; }
.chat-shell .jw .jv svg.tk { width: 100%; height: 22px; }
.chat-shell .jw .tk-off { stroke: rgba(9,53,85,.28); stroke-width: .6; }
.chat-shell .jw .jv-k { position: relative; height: 18px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--mute); font-variant-numeric: tabular-nums; }
.chat-shell .jw .jv-k span { position: absolute; top: 0; white-space: nowrap; font-weight: 500; }
.chat-shell .jw .jv-k.is-up { margin: 0 0 8px; }
.chat-shell .jw .jv-lg { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 14px; font-size: 12px; line-height: 16px; color: var(--ink); }
.chat-shell .jw .jv-lg span { display: inline-flex; align-items: center; gap: 7px; }
.chat-shell .jw-r { margin: 0 0 12px; font-size: 14px; line-height: 22px; color: var(--ink, #2b2f34); }

/* the job card's menu is North's menu (same as the chat's): white, hairline edge, soft drop, navy type, left aligned */
.agx.jm-host .cd-menu { top: 44px; right: 16px; min-width: 190px; padding: 4px !important; border-radius: 10px !important; background: #fff !important; border: 0.5px solid var(--edge); box-shadow: 0 16px 32px -16px rgba(9,53,85,.35) !important; z-index: 6; }
.agx.jm-host .cd-menu button { position: relative; border: 0 !important; box-shadow: none !important; display: flex; gap: 0; align-items: center; height: auto; padding: 8px 10px; border-radius: 6px; text-align: left; justify-content: flex-start; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--navy); background: none; white-space: nowrap; }

.agx.jm-host .cd-menu-away { position: fixed; inset: 0; z-index: 5; }
/* no stroke to show a button is open or focused: open is a soft fill */
.agx.jm-host .cd-ib:focus, .agx.jm-host .cd-ib:focus-visible { outline: none; box-shadow: none; }
.agx.jm-host .cd-ib.is-on { background: rgba(9,53,85,.06); }
/* findings sit together under the chart */
.agx.jm-host .rc-viz { margin-top: 2px; }
.agx.jm-host .rc-finds { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.agx.jm-host .rc-finds .rc-p { margin: 0; }
.agx.jm-host .rc-steps-t { align-self: flex-start; margin-top: 10px; }

/* the job card's header (and its menu) sits above the card's content: the menu is never drawn under the chart */
.agx.jm-host .cd.jm-card .cd-h { position: relative; z-index: 7; }
/* one window at a time: while a conversation is open, Home's greeting steps back with its field */
.chat-open:not(.chat-talking) .home-page .hello h1 { opacity: 0; filter: blur(4px); transition: opacity .3s, filter .3s; }
.home-page .hello h1 { transition: opacity .3s, filter .3s; }

.chat-shell .jw-finds { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.chat-shell .jw-finds .jw-r { margin: 0; }
.chat-shell .jw-x { margin: 2px 0 0; padding-left: 18px; font-size: 14px; line-height: 22px; color: var(--ink, #2b2f34); }

/* the work's tray sits under its findings, like every answer's */
.chat-shell .ch-msg.ch-work { display: block; }
.chat-shell .ch-work > .ch-acts { margin-top: 12px; }

/* who's in this conversation: their faces beside the title, overlapping like a group thread's */
.chat-head .ch-crew { display: inline-flex; align-items: center; margin-left: 8px; }
.chat-head .ch-crew > span { position: relative; display: inline-flex; margin-left: -4px; border-radius: 50%; }
.chat-head .ch-crew > span:first-child { margin-left: 0; }

/* ---- Sam's Home as a board (field.jsx): the score in the band, North's one move, then his month in four zones */
.fd { display: flex; flex-direction: column; min-width: 0; }
.fd-score { position: relative; z-index: 1; padding: 0 5px; max-width: 837px; }
.fd-score small { display: block; font-size: 12px; line-height: 16px; color: var(--ink); }
.fd-score-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 32px; flex-wrap: wrap; }
.fd-big { margin: 2px 0 0; font-size: 40px; line-height: 46px; font-weight: 500; letter-spacing: -0.03em; color: var(--navy); font-variant-numeric: tabular-nums; }
.fd-big span { font-size: 13px; letter-spacing: 0; font-weight: 500; color: var(--ink); margin-left: 6px; }
.fd-big.is-gap { font-size: 22px; line-height: 26px; letter-spacing: -0.02em; color: var(--alert); }
.fd-togo { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.fd-clock { display: flex; align-items: center; gap: 2px; }
.fd-clock i { width: 4px; height: 12px; border-radius: 1px; border: 1px solid rgba(9,53,85,.45); }
.fd-clock i.is-gone { background: rgba(9,53,85,.16); border-color: transparent; }
.fd-clock small { margin-left: 8px; color: var(--navy); font-weight: 500; }
.fd-bar { position: relative; height: 8px; margin: 14px 0 0; border-radius: 4px; background: rgba(9,53,85,.07); overflow: hidden; }
.fd-bar-v { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--navy); }
.fd-bar-gap { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(-45deg, rgba(177,4,47,.32) 0 2px, transparent 2px 5px); }
.fd-levers { display: flex; flex-wrap: wrap; gap: 10px 36px; margin-top: 14px; }
.fd-levers div { display: grid; grid-template-columns: auto; gap: 0; min-width: 0; }
.fd-levers b { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
.fd-levers span { font-size: 12px; line-height: 16px; color: var(--ink); }
.fd-levers small { color: var(--mute); }

.fd-north { overflow: hidden; position: relative; z-index: 1; }
.fd-north-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; max-width: 837px; margin: 14px 0 0 5px; }
.fd-north-mark { grid-row: span 2; padding-top: 1px; }
.fd-north p { margin: 0; font-size: 15px; line-height: 22px; color: var(--navy); text-wrap: pretty; max-width: 66ch; }
.fd-north-b { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fd-btn { height: 30px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--navy); background: rgba(9,53,85,.06); transition: background .2s; white-space: nowrap; }
.fd-btn:hover { background: rgba(9,53,85,.1); }
.fd-btn.is-main { background: var(--navy); color: #fff; } .fd-btn.is-main:hover { background: var(--navy-fill); }
.fd-btn.is-quiet { background: none; color: var(--ink); } .fd-btn.is-quiet:hover { background: rgba(9,53,85,.06); }
.is-field .home-ask { margin-top: 0; }
.fd-band { position: relative; z-index: 1; display: flow-root; }
.chat-open .fd-north { opacity: 0; pointer-events: none; transition: opacity .25s; }
.fd-nums { margin-top: 48px; }
.fd-nums .fd-score { padding: 0 0 0 5px; max-width: none; }
.top.is-sam { margin-left: 5px; }
.fd-sc { display: flex; flex-direction: column; gap: 4px; } .fd-sc.is-r { align-items: flex-end; text-align: right; }
.fd-huge { margin: 0; font-size: 56px; line-height: 56px; font-weight: 500; letter-spacing: -0.035em; color: var(--navy); font-variant-numeric: tabular-nums; }
.fd-tk { --trk: #e2e7ec; margin-top: 22px; }
.fd-tk svg.tk { display: block; width: 100%; overflow: visible; }
.fd-tk .tk-off { stroke: rgba(9,53,85,.28); stroke-width: .6; }
.fd-tk-k { position: relative; height: 16px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.fd-tk-k.is-up { margin: 0 0 8px; color: var(--coral); } .fd-tk-k.is-up span { transform: translateX(-100%); }
.fd-tk-k span { position: absolute; top: 0; white-space: nowrap; font-weight: 500; }
@media (max-width: 760px) { .fd-huge { font-size: 40px; line-height: 44px; } }
.top.is-sam { grid-template-columns: minmax(0, 1fr); margin-top: 24px; }

.fd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 48px 0 12px 5px; }
.fd-head h2 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--navy); }
.fd-lens { position: relative; display: inline-flex; padding: 2px; border-radius: 7px; background: rgba(9,53,85,.06); }

.fd-hr:focus-visible .chs-hover { background: rgba(9,53,85,.07); }
.fd-hr.is-dim { color: var(--mute); }
.fd-hr > .fd-hc.is-first { color: var(--navy); font-weight: 500; }
.fd-hr.is-h > .fd-hc.is-first { color: var(--mute); }
.fd-hr.is-dim > .fd-hc.is-first { color: var(--mute); }
.fd-hr > .fd-hc.is-last { text-align: right; }
.fd-pt, .fd-pros { display: none; }
.fd-pn { font-weight: 500; color: var(--navy); }
.fd-fitn { font-weight: 600; color: var(--navy); }

/* an opened row and what it opens are one piece: the row's tint carries on into the detail (no second grey box under it) */
.fd-hr.is-open .chs-hover { border-radius: 6px 6px 0 0; }
.fd-hr-x { overflow: hidden; margin: 0 -8px; border-radius: 0 0 6px 6px; background: rgba(9,53,85,.05); }
.fd-hr-xi { padding: 0 8px 12px; }
.fd-hr-x + .fd-hr::before { display: none; }
.fd-more { display: flex; flex-direction: column; gap: 4px; padding: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink); white-space: normal; }

.fd-more b { font-weight: 600; color: var(--navy); margin-right: 4px; }

/* list prospects: the last column ("why") wraps; deals: ARR right aligned (last column) */

.fd-ct-w { position: relative; display: flex; align-items: center; }

.fd-ct-tip b { font-weight: 600; color: var(--navy); }
.fd-deal-bar i { cursor: pointer; }
.fd-seg-tip { position: absolute; top: calc(100% + 6px); translate: -50% 0; white-space: nowrap; z-index: 3; padding: 4px 8px; border-radius: 6px; background: var(--paper); border: 0.5px solid var(--edge); font-size: 12px; line-height: 16px; color: var(--ink); pointer-events: none; }

.fd-hr .chs-hover { position: absolute; }
.fd-ct-tip { border: 0; background: none; padding: 0; }

.fd-o-in.is-tight .fd-o-calls { padding-top: 6px; }
.fd-o-in.is-tight .fd-hint { display: none; }
.fd-o-in.is-tight .fd-deal-bar { margin-top: 20px; }

/* ---------- Messages: conversation attached to the work (talk.jsx) */
.ms-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); border-radius: inherit; overflow: hidden; }
.ms { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ms-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px 14px; border-bottom: 0.5px solid var(--line); }
.ms-head-l, .ms-head-r { display: flex; align-items: center; gap: 16px; }
.ms-head h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 500; color: var(--navy); }
.ms-va { font-size: 12px; color: var(--mute); }
.ms-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); }
.ms-list, .ms-thread, .ms-side { min-height: 0; }
.ms-k { margin: 0 0 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); }
.ms-note { margin: 14px 4px 0; font-size: 12px; line-height: 16px; color: var(--mute); }
/* left list */
.ms-list { padding: 16px 12px; border-right: 0.5px solid var(--line); overflow: auto; }
.ms-list > .ms-k { padding: 0 8px; }
.ms-row { position: relative; display: block; width: 100%; padding: 8px; border-radius: 8px; text-align: left; }
.ms-row .chs-hover { position: absolute; z-index: 0; border-radius: 8px; }
.ms-row-on { position: absolute; inset: 0; border-radius: 8px; background: rgba(9,53,85,.07); z-index: 0; }
.ms-row-in { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
.ms-row.is-quiet { opacity: .55; }
.ms-rt { display: flex; flex-direction: column; min-width: 0; }
.ms-rt b { display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-rt small { font-size: 12px; line-height: 16px; color: var(--mute); }
.ms-avs { display: inline-flex; flex: none; }
.ms-avs > * + * { margin-left: -6px; }
.ms-avs.is-r { margin-left: auto; }
.ms-av { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 600; color: #fff; background: var(--navy); }
.ms-av.is-sam { background: #1f4b70; } .ms-av.is-jordan { background: #098486; } .ms-av.is-heather { background: #744ccb; } .ms-av.is-x { background: #b9c3cc; }
.ms-av.is-agent { background: var(--well); }
.ms-bell { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--edge); margin: 0 3px; }
.ms-bell.is-on { background: var(--navy); }
/* centre thread */
.ms-thread { min-width: 0; display: flex; flex-direction: column; }
.ms-th-head { display: flex; flex-direction: column; gap: 10px; padding: 14px 24px 12px; border-bottom: 0.5px solid var(--line); }
.ms-th-who { display: flex; align-items: center; gap: 10px; }
.ms-th-who b { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--navy); }
.ms-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ms-chip { position: relative; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--ink); transition: color .2s; }
.ms-chip:hover { color: var(--navy); }
.ms-chip.is-on { color: var(--navy); }
.ms-chip-on { position: absolute; inset: 0; border-radius: 6px; background: rgba(9,53,85,.08); }
.ms-chip-t { position: relative; display: inline-flex; align-items: center; gap: 5px; }
.ms-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--navy); }
.ms-msgs { flex: 1; min-height: 0; overflow: auto; padding: 16px 24px 8px; display: flex; flex-direction: column; gap: 18px; }
.ms-m { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
.ms-m-b { min-width: 0; }
.ms-m-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.ms-m-h b { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--navy); }
.ms-m-h time { font-size: 12px; color: var(--mute); }
.ms-m p { margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--ink); max-width: 64ch; text-wrap: pretty; }
.ms-tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; background: var(--well); font-size: 12px; font-weight: 500; color: var(--navy); transition: background .2s; }
.ms-tag:hover { background: #e4e2df; }
.ms-only { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mute); }
.ms-m.is-priv .ms-m-b > p { color: var(--navy); }
.ms-hint { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding: 6px 6px 6px 10px; border-radius: 7px; background: var(--well); font-size: 13px; line-height: 18px; color: var(--ink); }
.ms-hint button { height: 26px; padding: 0 10px; border-radius: 4px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 500; }
.ms-hint button.is-q { background: none; color: var(--navy); }
/* the hand-off */
.ms-ho { margin-top: 10px; max-width: 520px; padding: 14px 16px; border-radius: 8px; background: var(--well); }
.ms-ho-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; font-size: 13px; line-height: 18px; color: var(--ink); }
.ms-ho-h b { font-weight: 600; color: var(--navy); }
.ms-ho dl { margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
.ms-ho dl > div { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; font-size: 13px; line-height: 18px; }
.ms-ho dt { color: var(--mute); } .ms-ho dd { margin: 0; color: var(--ink); }
.ms-ho-a { display: flex; gap: 8px; margin-top: 12px; }
.ms-ho-a .btn-pri, .ms-ho-a .btn-sec { padding: 0 14px; }
.ms-ho-s { margin: 12px 0 0 !important; font-size: 13px !important; color: var(--mute) !important; }
.ms-ho-s.is-done { color: var(--navy) !important; }
/* composer: who and what above the field */
.ms-comp { padding: 10px 24px 18px; }
.ms-to { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 8px; font-size: 13px; line-height: 18px; }
.ms-to-k { color: var(--mute); }
.ms-to-v { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--navy); }
.ms-pick { position: relative; }
.ms-pick-b { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 5px; background: var(--well); font-size: 13px; font-weight: 500; color: var(--navy); }
.ms-pick-b.is-open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ms-pick-m { position: absolute; left: 0; bottom: 100%; z-index: 10; min-width: 260px; padding: 4px; border-radius: 8px 8px 8px 0; background: var(--well); transform-origin: bottom left; display: flex; flex-direction: column; }
.ms-pick-m button { display: flex; flex-direction: column; align-items: flex-start; padding: 7px 10px; border-radius: 6px; text-align: left; }
.ms-pick-m button.is-on { background: rgba(9,53,85,.07); }
.ms-pick-m b { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--navy); }
.ms-pick-m small { font-size: 12px; color: var(--mute); }
.ms-pick-m .is-new b { color: var(--ink); }
.ms-guess { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 5px; font-size: 12px; font-weight: 500; color: var(--navy); background: rgba(9,53,85,.06); }
.ms-field.composer { margin: 0; max-width: none; height: 44px; padding: 0 6px 0 14px; border-radius: 6px; flex: none; }
.ms-field .ph { line-height: 44px; font-size: 14px; }
.ms-field .ask-field input { font-size: 14px; }
.ms-field .ibtn-lg { width: 30px; height: 30px; }
.ms-field .voice { width: 32px; height: 32px; margin-left: 4px; }
.ms-field .voice .bars { scale: 0.85; }
/* right: the piece */
.ms-side { border-left: 0.5px solid var(--line); background: var(--well); overflow: auto; padding: 18px 20px; }
.ms-pc h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; font-size: 16px; line-height: 22px; font-weight: 500; color: var(--navy); }
.ms-facts { margin: 0; display: flex; flex-direction: column; }
.ms-facts > div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 0.5px solid var(--edge); font-size: 13px; line-height: 18px; }
.ms-facts dt { color: var(--mute); } .ms-facts dd { margin: 0; color: var(--navy); }
.ms-parts { margin-top: 18px; }
.ms-part { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; line-height: 18px; color: var(--ink); }
.ms-part .ms-pt { flex: 1; }
.ms-part em { font-style: normal; font-size: 12px; color: var(--mute); }
.ms-part.is-you em { color: var(--navy); font-weight: 500; }
.ms-ping { display: flex; gap: 10px; margin-top: 18px; padding: 12px; border-radius: 8px; background: var(--paper); }
.ms-ping i { flex: none; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--edge); }
.ms-ping.is-on i { background: var(--navy); }
.ms-ping div { display: flex; flex-direction: column; font-size: 13px; line-height: 18px; }
.ms-ping b { font-weight: 600; color: var(--navy); } .ms-ping span { color: var(--ink); }
.ms-in { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.ms-in .ms-k { margin: 0; }
.ms-in small { font-size: 12px; line-height: 16px; color: var(--ink); }
.ms-cu { display: flex; flex-direction: column; }
.ms-cu-r { display: flex; gap: 8px; padding: 10px 8px; margin: 0 -8px; border-radius: 8px; text-align: left; border-top: 0.5px solid var(--edge); transition: background .2s; }

.ms-cu-r .ms-bell { margin-top: 6px; }
.ms-cu-r > span:last-child { display: flex; flex-direction: column; font-size: 13px; line-height: 18px; color: var(--ink); }
.ms-cu-r b { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--navy); }
.ms-side .ms-note { margin: 14px 0 0; }

html:has(.ms-wrap) .demo-land { display: none; }

/* ---------- a hand-off lives on its piece: people in the piece's conversation */
.fd-ppl { display: inline-flex; flex: none; } .fd-ppl > * + * { margin-left: -4px; }
.fd-pp { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 600; color: #fff; background: #1f4b70; }
.fd-pp.is-jordan { background: #098486; } .fd-pp.is-heather { background: #744ccb; }
.fd-pp.is-ph { background-size: cover; background-position: center; background-color: #e9e4de; }
.fd-p-m .fd-ppl { margin-right: 1px; }
.fd-o-sc { flex: 1; min-height: 0; overflow: auto; }
.fd-conv { display: flex; flex-direction: column; gap: 14px; margin: 8px 16px 12px 24px; padding-top: 14px; border-top: 0.5px solid var(--edge); }
.fd-cm { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; }
.fd-cm p { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink); text-wrap: pretty; }
.fd-cm .fd-cm-h { display: flex; align-items: baseline; gap: 8px; }
.fd-cm-h b { font-weight: 600; color: var(--navy); } .fd-cm-h time { font-size: 12px; color: var(--mute); }
.fd-o-to { margin: 10px 14px 6px 24px; font-size: 12px; line-height: 16px; color: var(--mute); }
.fd-brief { margin: 0; display: flex; flex-direction: column; max-width: 560px; }
.fd-brief > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 0.5px solid var(--line); font-size: 14px; line-height: 20px; }
.fd-brief > div:last-child { border-bottom: 0.5px solid var(--line); }
.fd-brief dt { color: var(--mute); } .fd-brief dd { margin: 0; color: var(--navy); }

/* opened piece, per Seth's Figma (Opened job 5:2): priority alone above the title; the figures lead, one sentence a line;
   the right side on its own soft ground; steps fold to the live one with a toggle */
.fd-o-desc.is-lead { max-width: none; margin-top: 10px; font-size: 14px; line-height: 23px; color: var(--ink); }
.fd-o-desc.is-lead p { margin: 0; }
.fd-o-desc.is-lead b { font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
.fd-o-in.is-tight .fd-o-desc.is-lead { display: block; margin-top: 6px; line-height: 20px; }
.fd-o-story { margin-top: 9px; }
.fd-o-r { background: linear-gradient(154deg, #ebf0f5 14%, #ffe3de 128%); border-left: 0.5px solid var(--edge); }
.fd-o-r .mo-tools .fd-o-who, .fd-o-r .mo-tools .fd-o-who b { color: var(--navy); font-weight: 500; }
.fd-o-r .mo-tools .ibtn.mo-x { border-radius: 6px; border: 0.5px solid var(--edge); }
.fd-steps { padding: 10px 0 0; }
.fd-steps li { display: block; padding: 0; overflow: hidden; font-weight: 500; color: var(--mute); }
.fd-s-in { display: flex; align-items: flex-start; gap: 10px; padding: 4px 16px 4px 12px; }
.fd-steps .fd-s-m { width: 6px; height: 18px; overflow: visible; color: var(--mute); }
.fd-steps .fd-s-m i { width: 6px; height: 6px; background: #c9c6c2; }
.fd-steps .fd-s-m svg { flex: none; }
.fd-steps li em { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--mute); }
.fd-steps li.is-done { color: var(--mute); }
.fd-steps li.is-now, .fd-steps li.is-you, .fd-steps li.is-note { color: var(--navy); }
.fd-steps li.is-now em, .fd-steps li.is-you em { color: var(--navy); }
.fd-s-tg { flex: none; width: 16px; height: 20px; margin-top: -1px; display: grid; place-items: center; }
.fd-s-x { width: 20px; height: 20px; margin: 0 -2px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--navy); cursor: pointer; display: grid; place-items: center; transition: background .15s; }
.fd-s-x:hover { background: rgba(9, 53, 85, 0.06); }
.fd-s-x svg { transition: transform .28s cubic-bezier(.22, 1, .36, 1); }
.fd-steps.is-all .fd-s-x svg { transform: rotate(180deg); }
.fd-o-in.is-tight .fd-s-in { padding-block: 3px; }

/* Sam's Home as the loop: Needs you, Talking, Moving, Landed. Chats are cards like pieces; a chat opens as the same shape
   as an opened piece (the talk on the right, the work it made on the left) */
.fd-board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .fd-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .fd-board { grid-template-columns: minmax(0, 1fr); } }
.is-need .fd-dot { background: var(--coral); } .is-talk .fd-dot { background: var(--purple, #6d4fc2); } .is-moving .fd-dot { background: var(--teal); } .is-landed .fd-dot { background: var(--navy); }
.fd-chip.is-need .fd-dot { background: var(--coral); }
.fd-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fd-chat .fd-c-top .fd-ppl { min-height: 16px; }
.fd-clr { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; line-height: 16px; color: var(--mute); cursor: pointer; } .fd-clr:hover { color: var(--navy); }
.fd-kind { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--navy); }
.fd-o-tt { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; min-height: 26px; }
.fd-o-tt h2 { margin: 0 !important; }
.fd-o-tt form { flex: 1; min-width: 0; }
.fd-ren-b { flex: none; border: 0; background: none; padding: 0; font: inherit; font-size: 12px; line-height: 16px; color: var(--mute); cursor: pointer; }
.fd-ren-b:hover { color: var(--navy); }
.fd-ren { width: 100%; max-width: 520px; border: 0; border-bottom: 0.5px solid var(--edge); outline: 0; background: none; padding: 0 0 2px; font: inherit; font-size: 20px; line-height: 26px; font-weight: 500; color: var(--navy); }
.fd-cw ul { list-style: none; margin: 0; padding: 0; max-width: 560px; }
.fd-cw li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 0.5px solid var(--line); font-size: 14px; line-height: 20px; }
.fd-cw li:last-child { border-bottom: 0.5px solid var(--line); }
.fd-cw-t { flex: 1; min-width: 0; color: var(--navy); }
.fd-cw-s { flex: none; font-size: 13px; color: var(--mute); }
.fd-cw-e { margin: 0; font-size: 13px; line-height: 18px; color: var(--mute); }
.fd-o-l .fd-cw { margin-top: 26px; }
.fd-conv.is-chat { border-top: 0; padding-top: 4px; margin-top: 14px; }
.fd-cm.is-north > div > p:not(.fd-cm-h) { color: var(--mute); }
.fd-cm.is-sug > div > p:not(.fd-cm-h) { color: var(--ink); }
.fd-sug-b { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fd-sug-b .btn-pri, .fd-sug-b .btn-sec { height: 30px; padding: 0 12px; }
.fd-sug-d { display: flex; align-items: center; gap: 6px; margin-top: 4px !important; font-size: 12px !important; line-height: 16px !important; color: var(--navy) !important; }
.fd-nm { display: inline-grid; place-items: center; flex: none; }
.fd-pp.is-tap { cursor: pointer; transition: filter .15s; }
.fd-pp.is-tap:hover { filter: brightness(1.15); }
.fd-pop { position: fixed; z-index: 1000; width: 288px; padding: 12px 0 10px; border-radius: 8px; background: var(--paper); border: 0.5px solid var(--edge); }
.fd-pop-h { display: flex; align-items: center; gap: 8px; margin: 0 14px 8px; font-size: 13px; line-height: 18px; color: var(--navy); }
.fd-pop-h b { font-weight: 500; }
.fd-pop ul { list-style: none; margin: 0; padding: 0 6px; }
.fd-pop li { position: relative; }
.fd-pop li .chs-hover { position: absolute; border-radius: 6px; background: rgba(9, 53, 85, 0.05); pointer-events: none; }
.fd-pop li button { position: relative; display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 7px 8px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer; }

.ar-seg i { border-radius: 2px; background: var(--well); }
